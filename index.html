<!DOCTYPE html>

<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Data Donatur DKM Al-Khaier</title>

<style>

/* =====================================================
   DASAR
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f5f7fa,
      #e8eef3
    );

  color: #222;

  overflow: hidden;
}


/* =====================================================
   CONTAINER UTAMA
===================================================== */

.container {

  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;

  max-width: 1000px;

  margin: auto;

  background: #ffffff;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  padding: 15px 10px 10px;

  border-bottom: 1px solid #ddd;

  flex-shrink: 0;
}

.header h1 {

  margin: 0;

  font-size: 25px;

  font-weight: 700;

  letter-spacing: .5px;
}

.header .subtitle {

  margin-top: 5px;

  font-size: 13px;

  color: #666;
}


/* =====================================================
   JAM
===================================================== */

.datetime {

  text-align: center;

  font-size: 14px;

  font-weight: 600;

  margin-top: 4px;

  color: #444;
}


/* =====================================================
   TOTAL DONASI
===================================================== */

.total-box {

  margin: 12px 15px 8px;

  padding: 15px 10px;

  text-align: center;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #e8f5e9,
      #f5fff6
    );

  border: 1px solid #c8e6c9;

  flex-shrink: 0;
}

.total-label {

  font-size: 14px;

  color: #555;

  margin-bottom: 5px;
}

.total-value {

  font-size: 30px;

  font-weight: 800;

  color: #1b5e20;

  line-height: 1.2;

  word-break: break-word;
}


/* =====================================================
   BARIS JUMLAH DONATUR + TOMBOL
===================================================== */

.donor-info-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin: 4px 15px 10px;

  padding: 10px 12px;

  border-radius: 10px;

  background: #f7f7f7;

  border: 1px solid #e0e0e0;

  flex-shrink: 0;
}


/* jumlah donatur */

.donor-count {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  flex: 1;

  min-width: 0;
}

.donor-count-label {

  font-size: 14px;

  color: #555;

  white-space: nowrap;
}

.donor-count-value {

  font-size: 20px;

  font-weight: 700;

  color: #222;
}


/* =====================================================
   TOMBOL LIHAT DETAIL
===================================================== */

.detail-btn {

  flex-shrink: 0;

  border: none;

  background: #2e7d32;

  color: white;

  padding: 8px 12px;

  border-radius: 7px;

  font-size: 12px;

  font-weight: 600;

  cursor: pointer;

  white-space: nowrap;

  transition: .2s;
}

.detail-btn:hover {

  background: #1b5e20;

}

.detail-btn:active {

  transform: scale(.96);
}


/* =====================================================
   AREA DONATUR
===================================================== */

.donor-area {

  position: relative;

  flex: 1;

  overflow: hidden;

  margin: 0 10px;

  border-radius: 10px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.95),
      rgba(248,248,248,.95)
    );

  border: 1px solid #eee;
}


/* efek bayangan atas dan bawah */

.donor-area::before {

  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 30px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,1),
      rgba(255,255,255,0)
    );

  z-index: 5;

  pointer-events: none;
}

.donor-area::after {

  content: "";

  position: absolute;

  bottom: 0;
  left: 0;
  right: 0;

  height: 30px;

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,1),
      rgba(255,255,255,0)
    );

  z-index: 5;

  pointer-events: none;
}


/* =====================================================
   LIST DONATUR
===================================================== */

.donor-scroll {

  position: absolute;

  width: 100%;

  left: 0;

  top: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  will-change: transform;

  transform:
    translate3d(0, 0, 0);

  margin: 0;

  padding: 0;
}


/* =====================================================
   KARTU DONATUR
===================================================== */

.donor-card {

  width: calc(100% - 20px);

  margin: 5px 0;

  padding: 10px 12px;

  border-radius: 9px;

  background: #ffffff;

  border: 1px solid #e5e5e5;

  box-shadow:
    0 2px 5px rgba(0,0,0,.05);

  flex-shrink: 0;
}

.donor-name {

  font-size: 15px;

  font-weight: 700;

  margin-bottom: 4px;

  color: #222;
}

.donor-meta {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  font-size: 12px;

  color: #777;
}

.donor-amount {

  font-size: 14px;

  font-weight: 700;

  color: #2e7d32;
}


/* =====================================================
   PESAN KOSONG
===================================================== */

.empty-message {

  text-align: center;

  padding: 30px 15px;

  color: #888;

  font-size: 14px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  text-align: center;

  padding: 30px 10px;

  color: #777;

  font-size: 14px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

  display: none;

  position: fixed;

  z-index: 100;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  background:
    rgba(0,0,0,.55);

  padding: 20px;
}

.modal-content {

  position: relative;

  width: 100%;

  max-width: 900px;

  height: 90vh;

  margin: auto;

  background: white;

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  flex-direction: column;
}

.modal-header {

  padding: 14px 16px;

  border-bottom: 1px solid #ddd;

  display: flex;

  align-items: center;

  justify-content: space-between;

  flex-shrink: 0;
}

.modal-header h2 {

  margin: 0;

  font-size: 18px;
}

.close-btn {

  border: none;

  background: transparent;

  font-size: 25px;

  cursor: pointer;

  color: #555;

  line-height: 1;
}

.modal-body {

  overflow: auto;

  padding: 10px;
}


/* =====================================================
   TABEL
===================================================== */

table {

  width: 100%;

  border-collapse: collapse;

  font-size: 13px;
}

th {

  background: #2e7d32;

  color: white;

  padding: 9px 7px;

  text-align: left;

  position: sticky;

  top: 0;

  z-index: 2;
}

td {

  padding: 8px 7px;

  border-bottom: 1px solid #ddd;
}

tr:nth-child(even) {

  background: #f8f8f8;
}

.amount-cell {

  text-align: right;

  white-space: nowrap;
}


/* =====================================================
   STATUS
===================================================== */

.status {

  position: fixed;

  bottom: 8px;

  left: 50%;

  transform: translateX(-50%);

  padding: 5px 10px;

  font-size: 10px;

  color: #777;

  background: rgba(255,255,255,.8);

  border-radius: 5px;

  z-index: 20;
}


/* =====================================================
   HP
===================================================== */

@media (max-width: 600px) {

  body {

    background: #ffffff;

  }

  .container {

    max-width: none;

    width: 100%;

  }

  .header {

    padding:
      12px
      8px
      8px;
  }

  .header h1 {

    font-size: 21px;

  }

  .header .subtitle {

    font-size: 11px;

  }

  .datetime {

    font-size: 12px;

  }

  .total-box {

    margin:
      9px
      10px
      6px;

    padding:
      12px
      8px;

  }

  .total-label {

    font-size: 12px;

  }

  .total-value {

    font-size: 25px;

  }

  .donor-info-row {

    margin:
      3px
      10px
      7px;

    padding:
      8px
      9px;

  }

  .donor-count {

    gap: 6px;

  }

  .donor-count-label {

    font-size: 12px;

  }

  .donor-count-value {

    font-size: 18px;

  }

  .detail-btn {

    padding:
      7px
      10px;

    font-size: 11px;

  }

  .donor-area {

    margin:
      0
      7px;

  }

  .donor-card {

    width:
      calc(100% - 14px);

    padding:
      9px
      10px;

  }

  .donor-name {

    font-size: 14px;

  }

  .donor-meta {

    font-size: 11px;

  }

  .donor-amount {

    font-size: 13px;

  }

  .modal {

    padding: 8px;

  }

  .modal-content {

    height: 94vh;

    border-radius: 9px;

  }

  .modal-header {

    padding:
      11px
      12px;

  }

  .modal-header h2 {

    font-size: 16px;

  }

  table {

    font-size: 11px;

  }

  th,
  td {

    padding:
      7px
      5px;

  }

}


/* =====================================================
   HP SANGAT KECIL
===================================================== */

@media (max-width: 380px) {

  .donor-count-label {

    font-size: 11px;

  }

  .donor-count-value {

    font-size: 16px;

  }

  .detail-btn {

    padding:
      6px
      8px;

    font-size: 10px;

  }

  .total-value {

    font-size: 22px;

  }

}

</style>

<script>

/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyAoAlwjZ19-LW9-Szi_tAn1dUg-KSZnUA2fDTcJvm3R6GidRffZbRh3BuNepbvGr_t/exec";


/* =====================================================
   DATA GLOBAL
===================================================== */

let donorData = [];


/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
"dkm_al_khaier_donatur_cache_v2";

const CACHE_MAX_AGE =
5 * 60 * 1000;


/* =====================================================
   KECEPATAN SCROLL
===================================================== */

const DONOR_SCROLL_SPEED = 25;


/* =====================================================
   VARIABEL ANIMASI
===================================================== */

let donorScrollAnimation = null;

let donorScrollPosition = 0;

let donorScrollLastTime = null;


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function formatRupiah(angka) {

  const nilai =
    Number(angka) || 0;

  return "Rp " +
    nilai.toLocaleString("id-ID");

}


/* =====================================================
   JAM & TANGGAL
===================================================== */

function updateDateTime() {

  const now = new Date();

  const dd =
    String(now.getDate())
      .padStart(2, "0");

  const mm =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const yyyy =
    now.getFullYear();

  const hh =
    String(now.getHours())
      .padStart(2, "0");

  const min =
    String(now.getMinutes())
      .padStart(2, "0");

  const sec =
    String(now.getSeconds())
      .padStart(2, "0");

  document.getElementById(
    "datetime"
  ).textContent =
    dd + "/" +
    mm + "/" +
    yyyy +
    " : " +
    hh + ":" +
    min + ":" +
    sec;

}

setInterval(
  updateDateTime,
  1000
);

updateDateTime();


/* =====================================================
   AMBIL DATA DARI GOOGLE APPS SCRIPT
   FORMAT API:
   {
     success:true,
     data:[...]
   }
===================================================== */

function ambilData() {

  const loading =
    document.getElementById("loading");

  if (
    loading &&
    donorData.length === 0
  ) {

    loading.textContent =
      "Menghubungkan ke data donatur...";

  }


  const callbackName =
    "callback_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement("script");


  let selesai = false;


  /* ===================================================
     CALLBACK JSONP
  =================================================== */

  window[callbackName] =
    function(response) {

      if (selesai) return;

      selesai = true;


      try {

        console.log(
          "RESPON GOOGLE APPS SCRIPT:",
          response
        );


        if (
          !response ||
          response.success !== true
        ) {

          tampilkanError(
            "Data tidak dapat diambil."
          );

          return;
        }


        /*
          PENTING:

          API mengembalikan:

          response.data

          bukan response langsung.
        */

        if (
          !Array.isArray(
            response.data
          )
        ) {

          tampilkanError(
            "Format data tidak benar."
          );

          return;
        }


        /*
          Ambil SEMUA data.
          Tidak ada slice().
          Tidak ada batas 30/50/100.
        */

        donorData =
          response.data.slice();


        console.log(
          "JUMLAH DATA DITERIMA:",
          donorData.length
        );


        /*
          Simpan cache
        */

        try {

          localStorage.setItem(
            CACHE_KEY,

            JSON.stringify({
              time: Date.now(),
              data: donorData
            })
          );

        } catch (e) {}


        /*
          Tampilkan semua data
        */

        tampilkanData(
          donorData,
          false
        );


      } catch (error) {

        console.error(
          "Kesalahan membaca data:",
          error
        );

        tampilkanError(
          "Terjadi kesalahan membaca data."
        );


      } finally {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    };


  /* ===================================================
     ERROR JSONP
  =================================================== */

  script.onerror =
    function() {

      if (selesai) return;

      selesai = true;


      console.error(
        "JSONP gagal terhubung ke:",
        API_URL
      );


      if (
        donorData.length === 0
      ) {

        tampilkanError(
          "Tidak dapat terhubung ke Google Apps Script."
        );

      } else {

        document.getElementById(
          "status"
        ).textContent =
          "Data terakhir ditampilkan";

      }


      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


  /*
    Cache busting
  */

  script.src =
    API_URL +
    "?action=data" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* =====================================================
   TAMPILKAN CACHE
===================================================== */

function tampilkanCache() {

  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );

    if (!raw) return false;


    const cached =
      JSON.parse(raw);


    if (
      !cached ||
      !Array.isArray(cached.data)
    ) {

      return false;

    }


    if (
      Date.now() -
      Number(cached.time || 0)
      >
      CACHE_MAX_AGE
    ) {

      return false;

    }


    donorData =
      cached.data.slice();


    tampilkanData(
      donorData,
      true
    );


    return true;


  } catch (e) {

    console.error(
      "Cache error:",
      e
    );

    return false;

  }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(
  data,
  fromCache = false
) {

  /*
    Pastikan data benar-benar array.
  */

  if (
    !Array.isArray(data)
  ) {

    donorData = [];

  } else {

    /*
      JANGAN MEMBATASI DATA.

      Semua baris dari API dimasukkan.
    */

    donorData =
      data.filter(function(item) {

        return (
          item &&
          item.nama !== undefined &&
          item.nama !== null &&
          String(item.nama).trim() !== ""
        );

      });

  }


  console.log(
    "DATA YANG DITAMPILKAN:",
    donorData.length
  );


  /* ===================================================
     JUMLAH DONATUR
  =================================================== */

  document.getElementById(
    "jumlahDonatur"
  ).textContent =
    donorData.length;


  /* ===================================================
     TOTAL DONASI
  =================================================== */

  let total = 0;


  donorData.forEach(
    function(item) {

      total +=
        Number(item.jumlah) || 0;

    }
  );


  document.getElementById(
    "totalDonasi"
  ).textContent =
    formatRupiah(total);


  /* ===================================================
     AREA
  =================================================== */

  const area =
    document.getElementById(
      "donorArea"
    );


  stopDonorScroll();


  if (
    donorData.length === 0
  ) {

    area.innerHTML =
      '<div class="empty-message">' +
      'Belum ada data donatur.' +
      '</div>';


    document.getElementById(
      "status"
    ).textContent =
      "Data kosong";


    return;

  }


  /* ===================================================
     BUAT TRACK
  =================================================== */

  const scroll =
    document.createElement(
      "div"
    );


  scroll.className =
    "donor-scroll";


  /* ===================================================
     PEMBUATAN KARTU
  =================================================== */

  function buatKartuDonatur(
    item
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "donor-card";


    const nama =
      escapeHTML(
        item.nama
      );


    const tanggal =
      escapeHTML(
        item.tanggal || ""
      );


    const rt =
      item.rt !== undefined &&
      item.rt !== null &&
      String(item.rt).trim() !== ""
        ? escapeHTML(item.rt)
        : "-";


    const jumlah =
      formatRupiah(
        item.jumlah
      );


    card.innerHTML = `

      <div class="donor-name">
        ${nama}
      </div>

      <div class="donor-meta">

        <span>
          ${tanggal}
          &nbsp; • &nbsp;
          RT ${rt}
        </span>

        <span class="donor-amount">
          ${jumlah}
        </span>

      </div>

    `;


    return card;

  }


  /* ===================================================
     FRAGMENT
  =================================================== */

  const fragment =
    document.createDocumentFragment();


  /*
    SALINAN PERTAMA

    Semua data nomor 1 sampai terakhir.
  */

  donorData.forEach(
    function(item) {

      fragment.appendChild(
        buatKartuDonatur(item)
      );

    }
  );


  /*
    SALINAN KEDUA

    Hanya untuk membuat looping
    tanpa mengurangi data.
  */

  donorData.forEach(
    function(item) {

      fragment.appendChild(
        buatKartuDonatur(item)
      );

    }
  );


  area.innerHTML = "";


  area.appendChild(
    scroll
  );


  scroll.appendChild(
    fragment
  );


  /*
    Mulai dari posisi 0.

    Tidak lagi dimulai dari bawah layar.
    Dengan demikian kartu nomor 1 langsung
    menjadi bagian dari daftar.
  */

  donorScrollPosition = 0;

  donorScrollLastTime = null;


  /*
    Tunggu browser menghitung tinggi
    seluruh kartu sebelum memulai animasi.
  */

  requestAnimationFrame(
    function() {

      startDonorScroll();

    }
  );


  document.getElementById(
    "status"
  ).textContent =
    fromCache
      ? "Data tersimpan — memperbarui..."
      : "Data " +
        donorData.length +
        " donatur diperbarui";


  setTimeout(
    function() {

      const status =
        document.getElementById(
          "status"
        );

      if (status) {

        status.textContent = "";

      }

    },
    2500
  );

}


/* =====================================================
   STOP SCROLL
===================================================== */

function stopDonorScroll() {

  if (
    donorScrollAnimation
  ) {

    cancelAnimationFrame(
      donorScrollAnimation
    );

  }


  donorScrollAnimation =
    null;


  donorScrollLastTime =
    null;

}


/* =====================================================
   MULAI SCROLL
===================================================== */

function startDonorScroll() {

  stopDonorScroll();


  const area =
    document.getElementById(
      "donorArea"
    );


  const scroll =
    document.querySelector(
      ".donor-scroll"
    );


  if (
    !area ||
    !scroll ||
    donorData.length === 0
  ) {

    return;

  }


  /*
    Karena data dibuat 2 kali,
    tinggi satu putaran adalah
    setengah tinggi keseluruhan.
  */

  const totalHeight =
    scroll.scrollHeight;


  const oneListHeight =
    totalHeight / 2;


  if (
    oneListHeight <= 0
  ) {

    return;

  }


  /*
    Kalau seluruh data lebih pendek
    dari area layar, tidak perlu scroll.

    Semua data tetap terlihat.
  */

  if (
    oneListHeight <=
    area.clientHeight
  ) {

    donorScrollPosition = 0;

    scroll.style.transform =
      "translate3d(0,0,0)";

    return;

  }


  /*
    MULAI DARI 0.

    Jadi:
    nomor 1
    nomor 2
    nomor 3
    ...
    nomor terakhir

    semuanya akan melewati layar.
  */

  donorScrollPosition = 0;

  donorScrollLastTime = null;


  scroll.style.transform =
    "translate3d(0,0,0)";


  function animateScroll(
    timestamp
  ) {

    if (
      !donorScrollLastTime
    ) {

      donorScrollLastTime =
        timestamp;

    }


    let delta =
      (
        timestamp -
        donorScrollLastTime
      ) / 1000;


    /*
      Mencegah loncatan besar
      jika browser berhenti sebentar.
    */

    delta =
      Math.min(
        0.05,
        delta
      );


    donorScrollLastTime =
      timestamp;


    donorScrollPosition -=
      DONOR_SCROLL_SPEED *
      delta;


    /*
      Reset TEPAT setelah
      satu daftar selesai.

      Bukan berdasarkan
      tinggi layar.
      Bukan berdasarkan
      jumlah tertentu.

      Jadi seluruh data nomor 1
      sampai nomor terakhir selesai
      ditampilkan terlebih dahulu.
    */

    if (
      donorScrollPosition <=
      -oneListHeight
    ) {

      donorScrollPosition +=
        oneListHeight;

    }


    scroll.style.transform =
      "translate3d(0," +
      donorScrollPosition +
      "px,0)";


    donorScrollAnimation =
      requestAnimationFrame(
        animateScroll
      );

  }


  donorScrollAnimation =
    requestAnimationFrame(
      animateScroll
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value === undefined ||
    value === null
      ? ""
      : value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   BUKA DETAIL
===================================================== */

function bukaDetail() {

  const tbody =
    document.getElementById(
      "detailTableBody"
    );


  tbody.innerHTML = "";


  if (
    !donorData ||
    donorData.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="text-align:center;">

          Belum ada data donatur.

        </td>

      </tr>

    `;

  } else {

    /*
      Tampilkan SEMUA data.

      Tidak ada batas jumlah.
    */

    donorData.forEach(
      function(item) {

        const tr =
          document.createElement(
            "tr"
          );


        const rt =
          item.rt !== undefined &&
          item.rt !== null &&
          String(item.rt).trim() !== ""
            ? item.rt
            : "-";


        tr.innerHTML = `

          <td>
            ${escapeHTML(item.nomor)}
          </td>

          <td>
            ${escapeHTML(item.tanggal)}
          </td>

          <td>
            ${escapeHTML(item.nama)}
          </td>

          <td>
            ${escapeHTML(rt)}
          </td>

          <td class="amount-cell">
            ${formatRupiah(item.jumlah)}
          </td>

        `;


        tbody.appendChild(
          tr
        );

      }
    );

  }


  document.getElementById(
    "detailModal"
  ).style.display =
    "block";

}


/* =====================================================
   TUTUP DETAIL
===================================================== */

function tutupDetail() {

  document.getElementById(
    "detailModal"
  ).style.display =
    "none";

}


/* =====================================================
   KLIK LUAR MODAL
===================================================== */

window.onclick =
  function(event) {

    const modal =
      document.getElementById(
        "detailModal"
      );


    if (
      event.target === modal
    ) {

      tutupDetail();

    }

  };


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  message
) {

  document.getElementById(
    "status"
  ).textContent =
    message;


  const loading =
    document.getElementById(
      "loading"
    );


  if (loading) {

    loading.textContent =
      message;

  }

}


/* =====================================================
   JALANKAN
===================================================== */

tampilkanCache();

ambilData();


/* =====================================================
   RESIZE
===================================================== */

let resizeTimer = null;


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          if (
            donorData.length
          ) {

            tampilkanData(
              donorData,
              true
            );

          }

        },
        250
      );

  }
);


/* =====================================================
   REFRESH OTOMATIS
   60 DETIK
===================================================== */

setInterval(
  function() {

    ambilData();

  },
  60000
);

</script>
