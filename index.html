<title>Data Donatur DKM Al-Khaier</title>

<style>

/* =====================================================
   DASAR
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f5f7fa,
      #e8eef3
    );

  color: #222;

  overflow: hidden;
}


/* =====================================================
   CONTAINER UTAMA
===================================================== */

.container {

  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;

  max-width: 1000px;

  margin: auto;

  background: #ffffff;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  padding: 15px 10px 10px;

  border-bottom: 1px solid #ddd;

  flex-shrink: 0;
}

.header h1 {

  margin: 0;

  font-size: 25px;

  font-weight: 700;

  letter-spacing: .5px;
}

.header .subtitle {

  margin-top: 5px;

  font-size: 13px;

  color: #666;
}


/* =====================================================
   JAM
===================================================== */

.datetime {

  text-align: center;

  font-size: 14px;

  font-weight: 600;

  margin-top: 4px;

  color: #444;
}


/* =====================================================
   TOTAL DONASI
===================================================== */

.total-box {

  margin: 12px 15px 8px;

  padding: 15px 10px;

  text-align: center;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #e8f5e9,
      #f5fff6
    );

  border: 1px solid #c8e6c9;

  flex-shrink: 0;
}

.total-label {

  font-size: 14px;

  color: #555;

  margin-bottom: 5px;
}

.total-value {

  font-size: 30px;

  font-weight: 800;

  color: #1b5e20;

  line-height: 1.2;

  word-break: break-word;
}


/* =====================================================
   BARIS JUMLAH DONATUR + TOMBOL
===================================================== */

.donor-info-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin: 4px 15px 10px;

  padding: 10px 12px;

  border-radius: 10px;

  background: #f7f7f7;

  border: 1px solid #e0e0e0;

  flex-shrink: 0;
}


/* jumlah donatur */

.donor-count {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  flex: 1;

  min-width: 0;
}

.donor-count-label {

  font-size: 14px;

  color: #555;

  white-space: nowrap;
}

.donor-count-value {

  font-size: 20px;

  font-weight: 700;

  color: #222;
}


/* =====================================================
   TOMBOL LIHAT DETAIL
===================================================== */

.detail-btn {

  flex-shrink: 0;

  border: none;

  background: #2e7d32;

  color: white;

  padding: 8px 12px;

  border-radius: 7px;

  font-size: 12px;

  font-weight: 600;

  cursor: pointer;

  white-space: nowrap;

  transition: .2s;
}

.detail-btn:hover {

  background: #1b5e20;

}

.detail-btn:active {

  transform: scale(.96);
}


/* =====================================================
   AREA DONATUR
===================================================== */

.donor-area {

  position: relative;

  flex: 1;

  overflow: hidden;

  margin: 0 10px;

  border-radius: 10px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.95),
      rgba(248,248,248,.95)
    );

  border: 1px solid #eee;
}


/* efek bayangan atas dan bawah */

.donor-area::before {

  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 40px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,1),
      rgba(255,255,255,0)
    );

  z-index: 5;

  pointer-events: none;
}

.donor-area::after {

  content: "";

  position: absolute;

  bottom: 0;
  left: 0;
  right: 0;

  height: 40px;

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,1),
      rgba(255,255,255,0)
    );

  z-index: 5;

  pointer-events: none;
}


/* =====================================================
   LIST DONATUR
===================================================== */

.donor-scroll {

  position: absolute;

  width: 100%;

  left: 0;

  top: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  will-change: transform;

  transform: translate3d(0, 0, 0);
}


/* =====================================================
   KARTU DONATUR
===================================================== */

.donor-card {

  width: calc(100% - 20px);

  margin: 5px 0;

  padding: 10px 12px;

  border-radius: 9px;

  background: #ffffff;

  border: 1px solid #e5e5e5;

  box-shadow:
    0 2px 5px rgba(0,0,0,.05);

  flex-shrink: 0;
}

.donor-name {

  font-size: 15px;

  font-weight: 700;

  margin-bottom: 4px;

  color: #222;
}

.donor-meta {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  font-size: 12px;

  color: #777;
}

.donor-amount {

  font-size: 14px;

  font-weight: 700;

  color: #2e7d32;
}







/* =====================================================
   PESAN KOSONG
===================================================== */

.empty-message {

  text-align: center;

  padding: 30px 15px;

  color: #888;

  font-size: 14px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  text-align: center;

  padding: 30px 10px;

  color: #777;

  font-size: 14px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

  display: none;

  position: fixed;

  z-index: 100;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  background:
    rgba(0,0,0,.55);

  padding: 20px;
}

.modal-content {

  position: relative;

  width: 100%;

  max-width: 900px;

  height: 90vh;

  margin: auto;

  background: white;

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  flex-direction: column;
}

.modal-header {

  padding: 14px 16px;

  border-bottom: 1px solid #ddd;

  display: flex;

  align-items: center;

  justify-content: space-between;

  flex-shrink: 0;
}

.modal-header h2 {

  margin: 0;

  font-size: 18px;
}

.close-btn {

  border: none;

  background: transparent;

  font-size: 25px;

  cursor: pointer;

  color: #555;

  line-height: 1;
}

.modal-body {

  overflow: auto;

  padding: 10px;
}


/* =====================================================
   TABEL
===================================================== */

table {

  width: 100%;

  border-collapse: collapse;

  font-size: 13px;
}

th {

  background: #2e7d32;

  color: white;

  padding: 9px 7px;

  text-align: left;

  position: sticky;

  top: 0;

  z-index: 2;
}

td {

  padding: 8px 7px;

  border-bottom: 1px solid #ddd;
}

tr:nth-child(even) {

  background: #f8f8f8;
}

.amount-cell {

  text-align: right;

  white-space: nowrap;
}


/* =====================================================
   STATUS
===================================================== */

.status {

  position: fixed;

  bottom: 8px;

  left: 50%;

  transform: translateX(-50%);

  padding: 5px 10px;

  font-size: 10px;

  color: #777;

  background: rgba(255,255,255,.8);

  border-radius: 5px;

  z-index: 20;
}

  }

  .datetime {

  }

  .total-box {

      6px;

    padding:
      12px
      8px;

  }

  .total-label {

    font-size: 12px;

  }

  .total-value {

    font-size: 25px;

  }

  .donor-info-row {

    margin:
      3px
      10px
      7px;

    padding:
      8px
      9px;

  }

  .donor-count {

    gap: 6px;

  }

  .donor-count-label {

    font-size: 12px;

  }

  .donor-count-value {

    font-size: 18px;

  }

  .detail-btn {

    padding:
      7px
      10px;

    font-size: 11px;

  }

  .donor-area {

    margin:
      0
      7px;

  }

  .donor-card {

    width:
      calc(100% - 14px);

      9px

  }

  .donor-meta {

  }

  .modal-header {

      11px
      12px;

  }

  table {

}


/* =====================================================

===================================================== */

@media (max-width: 380px) {

<script>

/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const API_URL = "https://script.google.com/macros/s/AKfycbyTqwptHml5G7UHR291U2VYKdtN8R9ptnAKxzNo-k41PAh4quVKVMSKhM1PVZOQBRDg/exec";


/* =====================================================
   DATA GLOBAL
===================================================== */

let donorData = [];


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function formatRupiah(angka) {

  return "Rp " +
    Number(angka || 0)
      .toLocaleString("id-ID");

}


/* =====================================================
   JAM & TANGGAL
===================================================== */

function updateDateTime() {

  const now =
    new Date();

  const dd =
    String(
      now.getDate()
    ).padStart(2, "0");

  const mm =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const yyyy =
    now.getFullYear();

  const hh =
    String(
      now.getHours()
    ).padStart(2, "0");

  const min =
    String(
      now.getMinutes()
    ).padStart(2, "0");

  const sec =
    String(
      now.getSeconds()
    ).padStart(2, "0");


  document.getElementById(
    "datetime"
  ).textContent =
    dd + "/" +
    mm + "/" +
    yyyy +
    " : " +
    hh + ":" +
    min + ":" +
    sec;

}


/* jalankan jam */

setInterval(
  updateDateTime,
  1000
);

updateDateTime();


/* =====================================================
   JSONP
===================================================== */

function ambilData() {

  const callbackName =
    "callback_" +
    Date.now();

  const script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(response) {

      try {

        if (
          !response ||
          response.success !== true
        ) {

          tampilkanError(
            "Data tidak dapat diambil."
          );

          return;

        }


        donorData =
          Array.isArray(
            response.data
          )
            ? response.data
            : [];


        tampilkanData(
          donorData
        );


      } catch (error) {

        tampilkanError(
          "Terjadi kesalahan membaca data."
        );

      }


      /* bersihkan */

      delete window[
        callbackName
      ];

      script.remove();

    };


  script.onerror =
    function() {

      tampilkanError(
        "Tidak dapat terhubung ke Google Apps Script."
      );

      delete window[
        callbackName
      ];

      script.remove();

    };


  script.src =
    API_URL +
    "?action=data&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data) {


  /* -----------------------------------------------
     DATA YANG VALID SAJA
  ------------------------------------------------ */

  donorData =
    data.filter(function(item) {

      return (
        item &&
        item.nama &&
        String(item.nama).trim() !== ""
      );

    });


  /* -----------------------------------------------
     JUMLAH DONATUR
     
     Data yang diterima API sudah dimulai
     dari baris 3 spreadsheet.
  ------------------------------------------------ */

  const jumlah =
    donorData.length;


  document.getElementById(
    "jumlahDonatur"
  ).textContent =
    jumlah;


  /* -----------------------------------------------
     TOTAL DONASI
  ------------------------------------------------ */

  let total = 0;

  donorData.forEach(
    function(item) {

      total +=
        Number(
          item.jumlah
        ) || 0;

    }
  );


  document.getElementById(
    "totalDonasi"
  ).textContent =
    formatRupiah(total);

/* -----------------------------------------------
   DAFTAR DONATUR BERJALAN
   KECEPATAN TETAP / KONSTAN
------------------------------------------------ */

let donorScrollAnimation = null;

let donorScrollPosition = 0;

let donorScrollLastTime = null;

let donorScrollFirstHeight = 0;

let donorScrollSpeed = 28;


/*
 * Kecepatan scroll:
 *
 * 28 = sedang
 *
 * Jika ingin sedikit lebih lambat:
 * 22
 *
 * Jika ingin sedikit lebih cepat:
 * 35
 *
 * Nilai ini TIDAK dipengaruhi jumlah data.
 */


function stopDonorScroll() {

  if (donorScrollAnimation) {

    cancelAnimationFrame(
      donorScrollAnimation
    );

    donorScrollAnimation = null;

  }

  donorScrollLastTime = null;

}


/* =====================================================
   MULAI SCROLL
===================================================== */

function startDonorScroll() {

  stopDonorScroll();


  const area =
    document.getElementById(
      "donorArea"
    );


  const scroll =
    document.querySelector(
      ".donor-scroll"
    );


  if (!area || !scroll) {

    return;

  }


  /*
   * Karena data dibuat 2 kali,
   * tinggi data pertama = setengah
   * tinggi seluruh wrapper.
   */

  donorScrollFirstHeight =
    scroll.scrollHeight / 2;


  if (
    donorScrollFirstHeight <= 0
  ) {

    return;

  }


  /*
   * Mulai dari bawah area.
   */

  donorScrollPosition =
    area.clientHeight;


  scroll.style.transform =
    "translate3d(0, " +
    donorScrollPosition +
    "px, 0)";


  donorScrollLastTime = null;


  function animateScroll(timestamp) {


    if (
      !donorScrollLastTime
    ) {

      donorScrollLastTime =
        timestamp;

    }


    const deltaTime =
      (timestamp -
        donorScrollLastTime) /
      1000;


    donorScrollLastTime =
      timestamp;


    /*
     * Bergerak dengan kecepatan
     * PIXEL PER DETIK.
     *
     * Jadi jumlah data tidak
     * mempengaruhi kecepatan.
     */

    donorScrollPosition -=
      donorScrollSpeed *
      deltaTime;


    /*
     * Jika salinan pertama sudah
     * lewat seluruh area,
     * langsung geser kembali
     * sebesar tinggi satu salinan.
     *
     * Tidak ada jeda kosong.
     */

    if (
      donorScrollPosition <=
      -donorScrollFirstHeight
    ) {

      donorScrollPosition +=
        donorScrollFirstHeight;

    }


    scroll.style.transform =
      "translate3d(0, " +
      donorScrollPosition +
      "px, 0)";


    donorScrollAnimation =
      requestAnimationFrame(
        animateScroll
      );

  }


  donorScrollAnimation =
    requestAnimationFrame(
      animateScroll
    );

}


/* =====================================================
   TAMPILKAN DATA DONATUR
===================================================== */

function tampilkanData(data) {


  /* -----------------------------------------------
     DATA YANG VALID SAJA
  ------------------------------------------------ */

  donorData =
    data.filter(function(item) {

      return (
        item &&
        item.nama &&
        String(item.nama).trim() !== ""
      );

    });


  /* -----------------------------------------------
     JUMLAH DONATUR
  ------------------------------------------------ */

  const jumlah =
    donorData.length;


  document.getElementById(
    "jumlahDonatur"
  ).textContent =
    jumlah;


  /* -----------------------------------------------
     TOTAL DONASI
  ------------------------------------------------ */

  let total = 0;


  donorData.forEach(
    function(item) {

      total +=
        Number(
          item.jumlah
        ) || 0;

    }
  );


  document.getElementById(
    "totalDonasi"
  ).textContent =
    formatRupiah(total);


  /* -----------------------------------------------
     AREA DONATUR
  ------------------------------------------------ */

  const area =
    document.getElementById(
      "donorArea"
    );


  /*
   * Hentikan animasi lama sebelum
   * membuat daftar baru.
   */

  stopDonorScroll();


  if (donorData.length === 0) {

    area.innerHTML = `
      <div class="empty-message">
        Belum ada data donatur.
      </div>
    `;


    document.getElementById(
      "status"
    ).textContent =
      "Data kosong";


    return;

  }


  /* -----------------------------------------------
     BUAT WRAPPER
  ------------------------------------------------ */

  const scroll =
    document.createElement(
      "div"
    );


  scroll.className =
    "donor-scroll";


  /*
   * DATA DIBUAT 2 KALI.
   *
   * Salinan kedua harus sama persis
   * dengan salinan pertama agar
   * pergantian dapat berlangsung
   * tanpa terlihat putus.
   */

  const dataBerulang =
    donorData.concat(
      donorData
    );


  dataBerulang.forEach(
    function(item) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "donor-card";


      card.innerHTML = `

        <div class="donor-name">
          ${escapeHTML(item.nama)}
        </div>

        <div class="donor-meta">

          <span>
            ${escapeHTML(item.tanggal || "")}
            &nbsp; • &nbsp;
            RT ${escapeHTML(item.rt || "")}
          </span>

          <span class="donor-amount">
            ${formatRupiah(item.jumlah)}
          </span>

        </div>

      `;


      scroll.appendChild(
        card
      );

    }
  );


  /*
   * Masukkan wrapper ke area.
   */

  area.innerHTML = "";

  area.appendChild(
    scroll
  );


  /*
   * Tunggu browser selesai menghitung
   * tinggi elemen, baru mulai animasi.
   */

  requestAnimationFrame(
    function() {

      startDonorScroll();

    }
  );


  document.getElementById(
    "status"
  ).textContent =
    "Data diperbarui";


  setTimeout(
    function() {

      document.getElementById(
        "status"
      ).textContent = "";

    },
    2500
  );

}


/* =====================================================
   JIKA UKURAN LAYAR BERUBAH
===================================================== */

let donorResizeTimer = null;


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      donorResizeTimer
    );


    donorResizeTimer =
      setTimeout(
        function() {

          if (
            donorData &&
            donorData.length > 0
          ) {

            startDonorScroll();

          }

        },
        200
      );

  }
);

     


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   BUKA DETAIL
===================================================== */

function bukaDetail() {

  const tbody =
    document.getElementById(
      "detailTableBody"
    );


  tbody.innerHTML = "";


  if (
    !donorData ||
    donorData.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="5"
          style="text-align:center;">
          Belum ada data donatur.
        </td>
      </tr>
    `;

  } else {

    donorData.forEach(
      function(item) {

        const tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML = `

          <td>
            ${escapeHTML(item.nomor)}
          </td>

          <td>
            ${escapeHTML(item.tanggal)}
          </td>

          <td>
            ${escapeHTML(item.nama)}
          </td>

          <td>
            ${escapeHTML(item.rt)}
          </td>

          <td class="amount-cell">
            ${formatRupiah(item.jumlah)}
          </td>

        `;


        tbody.appendChild(
          tr
        );

      }
    );

  }


  document.getElementById(
    "detailModal"
  ).style.display =
    "block";

}


/* =====================================================
   TUTUP DETAIL
===================================================== */

function tutupDetail() {

  document.getElementById(
    "detailModal"
  ).style.display =
    "none";

}


/* klik area luar modal */

window.onclick =
  function(event) {

    const modal =
      document.getElementById(
        "detailModal"
      );

    if (
      event.target === modal
    ) {

      tutupDetail();

    }

  };


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

  document.getElementById(
    "loading"
  )?.remove();

}


/* =====================================================
   JALANKAN
===================================================== */

ambilData();


/* =====================================================
   REFRESH OTOMATIS
   60 DETIK
===================================================== */

setInterval(
  function() {

    ambilData();

  },
  60000
);

</script>
