
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<base target="_top">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Data Donatur DKM Al-Khaier</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{

  font-family:Arial, sans-serif;

  background:#d8d0d0;

  overflow:hidden;

}


/* =========================
   CONTAINER
========================= */

.container{

  width:100%;
  max-width:1000px;

  height:100vh;

  margin:auto;

  padding:10px;

  display:flex;
  flex-direction:column;

}


/* =========================
   HEADER
========================= */

.header{

  background:#ffffff;

  border-radius:12px;

  padding:12px 15px;

  text-align:center;

  box-shadow:0 2px 8px rgba(0,0,0,.12);

  flex-shrink:0;

}

.header h1{

  margin:0;

  font-size:25px;

  color:#173b2b;

}

.header p{

  margin:5px 0 0;

  font-size:15px;

  color:#555;

}


/* =========================
   TANGGAL
========================= */

.tanggal{

  margin-top:7px;

  font-size:13px;

  color:#777;

}


/* =========================
   TOTAL DONASI
========================= */

.total-box{

  margin-top:10px;

  background:#ffffff;

  border-radius:12px;

  padding:10px;

  text-align:center;

  box-shadow:0 2px 8px rgba(0,0,0,.12);

  flex-shrink:0;

}

.total-title{

  font-size:13px;

  color:#666;

}

.total-value{

  margin-top:3px;

  font-size:24px;

  font-weight:bold;

  color:#173b2b;

}


/* =========================
   JUMLAH DONATUR
========================= */

.donor-info{

  margin-top:8px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  background:#ffffff;

  border-radius:10px;

  padding:8px 12px;

  box-shadow:0 2px 8px rgba(0,0,0,.10);

  flex-shrink:0;

}

.donor-count{

  font-size:14px;

  color:#555;

}

.donor-count b{

  color:#173b2b;

}


/* =========================
   BUTTON DETAIL
========================= */

.detail-button{

  border:none;

  background:#173b2b;

  color:#ffffff;

  padding:7px 13px;

  border-radius:7px;

  font-size:13px;

  cursor:pointer;

}

.detail-button:hover{

  opacity:.9;

}


/* =========================
   AREA DONATUR
========================= */

.donor-area{

  position:relative;

  flex:1;

  min-height:0;

  overflow:hidden;

  margin:8px 0 0;

  background:#ffffff;

  border-radius:12px;

  box-shadow:0 2px 8px rgba(0,0,0,.12);

}


/*
   GRADASI ATAS
*/

.donor-area::before{

  content:"";

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:45px;

  background:
    linear-gradient(
      to bottom,
      #ffffff 0%,
      rgba(255,255,255,.95) 35%,
      rgba(255,255,255,0) 100%
    );

  z-index:5;

  pointer-events:none;

}


/*
   GRADASI BAWAH
*/

.donor-area::after{

  content:"";

  position:absolute;

  bottom:0;
  left:0;
  right:0;

  height:45px;

  background:
    linear-gradient(
      to top,
      #ffffff 0%,
      rgba(255,255,255,.95) 35%,
      rgba(255,255,255,0) 100%
    );

  z-index:5;

  pointer-events:none;

}


/* =========================
   SCROLL UTAMA
========================= */

.donor-scroll{

  position:absolute;

  top:0;
  left:0;

  width:100%;

  display:flex;
  flex-direction:column;

  align-items:center;

  margin:0;
  padding:0;

  will-change:transform;

}


/* =========================
   SATU DAFTAR
========================= */

.donor-list{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  flex-shrink:0;

  margin:0;
  padding:0;

}


/* =========================
   KARTU DONATUR
========================= */

.donor-card{

  width:calc(100% - 20px);

  margin:5px 0;

  padding:10px 12px;

  background:#f8faf9;

  border:1px solid #e0e5e2;

  border-radius:9px;

  flex-shrink:0;

}

.donor-name{

  font-size:15px;

  font-weight:bold;

  color:#173b2b;

  margin-bottom:3px;

  word-break:break-word;

}

.donor-detail{

  display:flex;

  justify-content:space-between;

  gap:10px;

  font-size:13px;

  color:#666;

}

.donor-rt{

  white-space:nowrap;

}

.donor-amount{

  font-weight:bold;

  color:#333;

  text-align:right;

  white-space:nowrap;

}


/* =========================
   MODAL
========================= */

.modal{

  display:none;

  position:fixed;

  z-index:100;

  left:0;
  top:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,.55);

  padding:15px;

}

.modal-content{

  position:relative;

  width:100%;

  max-width:900px;

  max-height:90vh;

  margin:3vh auto;

  background:#ffffff;

  border-radius:12px;

  padding:15px;

  overflow:auto;

}

.modal-title{

  text-align:center;

  margin:0 0 12px;

  color:#173b2b;

  font-size:20px;

}

.close{

  position:absolute;

  top:7px;
  right:12px;

  font-size:28px;

  font-weight:bold;

  color:#777;

  cursor:pointer;

}


/* =========================
   TABLE DETAIL
========================= */

.detail-table{

  width:100%;

  border-collapse:collapse;

  font-size:13px;

}

.detail-table th,
.detail-table td{

  border:1px solid #ddd;

  padding:7px;

}

.detail-table th{

  background:#173b2b;

  color:#ffffff;

}

.detail-table tr:nth-child(even){

  background:#f7f7f7;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  color:#777;

  padding:25px;

  font-size:14px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .container{

    padding:7px;

  }

  .header{

    padding:9px 10px;

  }

  .header h1{

    font-size:20px;

  }

  .header p{

    font-size:12px;

  }

  .tanggal{

    font-size:11px;

  }

  .total-box{

    padding:8px;

  }

  .total-value{

    font-size:20px;

  }

  .donor-info{

    padding:7px 9px;

  }

  .donor-card{

    width:calc(100% - 14px);

    padding:9px 10px;

  }

  .donor-name{

    font-size:14px;

  }

  .donor-detail{

    font-size:12px;

  }

  .detail-button{

    padding:6px 10px;

    font-size:12px;

  }

  .modal{

    padding:8px;

  }

  .modal-content{

    margin:2vh auto;

    padding:10px;

  }

  .detail-table{

    font-size:11px;

  }

}


/* =========================
   SANGAT KECIL
========================= */

@media(max-height:600px){

  .header{

    padding:6px 10px;

  }

  .header h1{

    font-size:18px;

  }

  .header p{

    margin-top:2px;

    font-size:11px;

  }

  .tanggal{

    margin-top:3px;

  }

  .total-box{

    margin-top:5px;

    padding:5px;

  }

  .total-value{

    font-size:18px;

  }

  .donor-info{

    margin-top:5px;

    padding:5px 8px;

  }

  .donor-area{

    margin-top:5px;

  }

}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  font-size:10px;

  color:#777;

  padding:4px 0 0;

  flex-shrink:0;

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>🕌 DKM Al-Khaier</h1>

    <p>
      Data Donatur Maulud Nabi
      (Rabiul Awal 1448 H)
    </p>

    <div
      id="tanggal"
      class="tanggal">
      Memuat waktu...
    </div>

  </div>


  <!-- TOTAL DONASI -->

  <div class="total-box">

    <div class="total-title">
      Total Donasi
    </div>

    <div
      id="totalDonasi"
      class="total-value">
      Rp 0
    </div>

  </div>


  <!-- INFO DONATUR -->

  <div class="donor-info">

    <div class="donor-count">

      Jumlah Donatur :
      <b id="jumlahDonatur">0</b>

    </div>

    <button
      class="detail-button"
      onclick="bukaDetail()">

      Lihat Detail

    </button>

  </div>


  <!-- AREA DONATUR -->

  <div
    id="donorArea"
    class="donor-area">

    <div class="loading">

      Memuat data donatur...

    </div>

  </div>


  <div class="footer">

    DKM Masjid Jami Al-Khaier

  </div>


</div>


<!-- =========================
     MODAL DETAIL
========================= -->

<div
  id="detailModal"
  class="modal">

  <div class="modal-content">

    <span
      class="close"
      onclick="tutupDetail()">
      &times;
    </span>

    <h2 class="modal-title">
      Detail Data Donatur
    </h2>

    <div id="detailTable">
      Memuat...
    </div>

  </div>

</div>


<script>


/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwrnx3Pr9zyEv9ZfUi6e2QuhafgG7L_SkQuvRuOW576Q3yvjXKDht0HvXnSPngHiXaq/exec";


/* =====================================================
   VARIABEL
===================================================== */

let donorData = [];

let donorScrollAnimation = null;

let donorScrollPosition = 0;

let donorScrollLastTime = null;


/*
   Kecepatan dalam pixel per detik.

   32 = cukup pelan.

   Jika ingin lebih lambat:
   20 atau 25

   Jika ingin lebih cepat:
   40 atau 45
*/

const DONOR_SCROLL_SPEED = 32;


/* =====================================================
   STOP ANIMASI
===================================================== */

function stopDonorScroll(){

  if(donorScrollAnimation !== null){

    cancelAnimationFrame(
      donorScrollAnimation
    );

    donorScrollAnimation = null;

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function formatRupiah(value){

  const angka =
    Number(value) || 0;

  return "Rp " +
    angka.toLocaleString("id-ID");

}


/* =====================================================
   BUAT KARTU DONATUR
===================================================== */

function buatKartuDonatur(item){

  const card =
    document.createElement("div");

  card.className =
    "donor-card";


  const nama =
    escapeHTML(item.nama || "-");

  const rt =
    escapeHTML(item.rt || "-");

  const tanggal =
    escapeHTML(item.tanggal || "-");

  const jumlah =
    formatRupiah(item.jumlah);


  card.innerHTML = `

    <div class="donor-name">

      ${nama}

    </div>


    <div class="donor-detail">

      <span class="donor-rt">

        RT ${rt}

        &nbsp;•&nbsp;

        ${tanggal}

      </span>


      <span class="donor-amount">

        ${jumlah}

      </span>

    </div>

  `;


  return card;

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data){

  /*
     Pastikan hanya data dengan nama donatur
     yang ditampilkan.
  */

  donorData =
    Array.isArray(data)

      ? data.filter(function(item){

          return String(
            item.nama || ""
          ).trim() !== "";

        })

      : [];


  /*
     JUMLAH DONATUR
  */

  document.getElementById(
    "jumlahDonatur"
  ).textContent =
    donorData.length;


  /*
     TOTAL DONASI
  */

  const total =
    donorData.reduce(
      function(sum,item){

        return sum +
          (Number(item.jumlah) || 0);

      },
      0
    );


  document.getElementById(
    "totalDonasi"
  ).textContent =
    formatRupiah(total);


  /*
     HENTIKAN ANIMASI LAMA
  */

  stopDonorScroll();


  const area =
    document.getElementById(
      "donorArea"
    );


  /*
     JIKA TIDAK ADA DATA
  */

  if(!donorData.length){

    area.innerHTML = `

      <div class="loading">

        Belum ada data donatur.

      </div>

    `;

    return;

  }


  /*
     BUAT CONTAINER SCROLL
  */

  const scroll =
    document.createElement("div");

  scroll.className =
    "donor-scroll";


  /*
     DAFTAR PERTAMA
  */

  const list1 =
    document.createElement("div");

  list1.className =
    "donor-list";


  /*
     DAFTAR KEDUA
     HARUS IDENTIK DENGAN DAFTAR PERTAMA
  */

  const list2 =
    document.createElement("div");

  list2.className =
    "donor-list";


  /*
     MASUKKAN SEMUA DATA
     KE DAFTAR PERTAMA
  */

  donorData.forEach(function(item){

    list1.appendChild(
      buatKartuDonatur(item)
    );

  });


  /*
     MASUKKAN SEMUA DATA
     KE DAFTAR KEDUA
  */

  donorData.forEach(function(item){

    list2.appendChild(
      buatKartuDonatur(item)
    );

  });


  /*
     GABUNGKAN
  */

  scroll.appendChild(list1);

  scroll.appendChild(list2);


  /*
     MASUKKAN KE AREA
  */

  area.innerHTML = "";

  area.appendChild(scroll);


  /*
     TUNGGU BROWSER SELESAI
     MENGHITUNG TINGGI SEMUA KARTU
  */

  requestAnimationFrame(function(){

    requestAnimationFrame(function(){

      startDonorScroll();

    });

  });

}


/* =====================================================
   ANIMASI MELAYANG
===================================================== */

function startDonorScroll(){

  stopDonorScroll();


  const area =
    document.getElementById(
      "donorArea"
    );


  const scroll =
    document.querySelector(
      ".donor-scroll"
    );


  const list1 =
    document.querySelector(
      ".donor-list"
    );


  if(
    !area ||
    !scroll ||
    !list1 ||
    !donorData.length
  ){

    return;

  }


  /*
     PENTING:

     Ambil tinggi NYATA dari daftar pertama.

     BUKAN:

     scrollHeight / 2

     Dengan cara ini seluruh baris
     sampai donatur terakhir ikut dihitung.
  */

  const listHeight =
    list1.getBoundingClientRect().height;


  if(listHeight <= 0){

    return;

  }


  /*
     MULAI DARI ATAS
  */

  donorScrollPosition = 0;

  donorScrollLastTime = null;


  scroll.style.transform =
    "translate3d(0,0,0)";


  /*
     FUNGSI ANIMASI
  */

  function animateScroll(timestamp){

    /*
       Waktu pertama
    */

    if(!donorScrollLastTime){

      donorScrollLastTime =
        timestamp;

    }


    /*
       Hitung waktu antar frame
    */

    const delta =
      Math.min(
        0.05,
        (timestamp -
          donorScrollLastTime) / 1000
      );


    donorScrollLastTime =
      timestamp;


    /*
       GERAK KE ATAS
    */

    donorScrollPosition -=
      DONOR_SCROLL_SPEED *
      delta;


    /*
       JIKA SUDAH MELEWATI
       SELURUH DAFTAR PERTAMA
    */

    if(
      donorScrollPosition <=
      -listHeight
    ){

      /*
         Karena list kedua
         sama persis dengan list pertama,
         kita bisa kembali ke 0
         tanpa terlihat loncatan.
      */

      donorScrollPosition = 0;

    }


    /*
       TERAPKAN POSISI
    */

    scroll.style.transform =
      "translate3d(0," +
      donorScrollPosition +
      "px,0)";


    /*
       FRAME BERIKUTNYA
    */

    donorScrollAnimation =
      requestAnimationFrame(
        animateScroll
      );

  }


  /*
     MULAI
  */

  donorScrollAnimation =
    requestAnimationFrame(
      animateScroll
    );

}


/* =====================================================
   JSONP
===================================================== */

function ambilDataDonatur(){

  const callbackName =
    "callbackDonatur_" +
    Date.now();


  window[callbackName] =
    function(data){

      try{

        tampilkanData(data);

        /*
           SIMPAN CACHE
        */

        localStorage.setItem(
          "donorDataCache",
          JSON.stringify(data)
        );

      }
      catch(error){

        console.error(error);

      }


      /*
         HAPUS SCRIPT JSONP
      */

      const script =
        document.getElementById(
          callbackName
        );

      if(script){

        script.remove();

      }


      try{

        delete window[callbackName];

      }
      catch(e){}

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=data&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.onerror =
    function(){

      console.error(
        "Gagal mengambil data dari Apps Script."
      );

      /*
         Jika gagal,
         coba tampilkan cache.
      */

      tampilkanCache();


      script.remove();

      try{

        delete window[callbackName];

      }
      catch(e){}

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   CACHE
===================================================== */

function tampilkanCache(){

  try{

    const cache =
      localStorage.getItem(
        "donorDataCache"
      );


    if(!cache){

      return;

    }


    const data =
      JSON.parse(cache);


    if(Array.isArray(data)){

      tampilkanData(data);

    }

  }
  catch(error){

    console.error(
      "Cache error:",
      error
    );

  }

}


/* =====================================================
   DETAIL
===================================================== */

function bukaDetail(){

  const modal =
    document.getElementById(
      "detailModal"
    );


  const table =
    document.getElementById(
      "detailTable"
    );


  modal.style.display =
    "block";


  if(!donorData.length){

    table.innerHTML =
      "<p>Belum ada data donatur.</p>";

    return;

  }


  let html = `

    <table class="detail-table">

      <thead>

        <tr>

          <th>No</th>

          <th>Tanggal</th>

          <th>Nama Donatur</th>

          <th>RT</th>

          <th>Jumlah</th>

        </tr>

      </thead>

      <tbody>

  `;


  donorData.forEach(
    function(item,index){

      html += `

        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            ${escapeHTML(
              item.tanggal || "-"
            )}
          </td>

          <td>
            ${escapeHTML(
              item.nama || "-"
            )}
          </td>

          <td>
            ${escapeHTML(
              item.rt || "-"
            )}
          </td>

          <td>
            ${formatRupiah(
              item.jumlah
            )}
          </td>

        </tr>

      `;

    }
  );


  html += `

      </tbody>

    </table>

  `;


  table.innerHTML =
    html;

}


/* =====================================================
   TUTUP DETAIL
===================================================== */

function tutupDetail(){

  document.getElementById(
    "detailModal"
  ).style.display =
    "none";

}


/* =====================================================
   KLIK DI LUAR MODAL
===================================================== */

window.onclick =
  function(event){

    const modal =
      document.getElementById(
        "detailModal"
      );


    if(event.target === modal){

      tutupDetail();

    }

  };


/* =====================================================
   TANGGAL & JAM REALTIME
===================================================== */

function updateTanggal(){

  const sekarang =
    new Date();


  const bulan = [

    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "Mei",
    "Jun",
    "Jul",
    "Agu",
    "Sep",
    "Okt",
    "Nov",
    "Des"

  ];


  const jam =
    String(
      sekarang.getHours()
    ).padStart(2,"0");


  const menit =
    String(
      sekarang.getMinutes()
    ).padStart(2,"0");


  const detik =
    String(
      sekarang.getSeconds()
    ).padStart(2,"0");


  const tanggal =
    String(
      sekarang.getDate()
    ).padStart(2,"0");


  const namaBulan =
    bulan[
      sekarang.getMonth()
    ];


  const tahun =
    sekarang.getFullYear();


  document.getElementById(
    "tanggal"
  ).textContent =

    jam + ":" +
    menit + ":" +
    detik +
    " " +
    tanggal + "/" +
    namaBulan + "/" +
    tahun;

}


/* =====================================================
   REFRESH DATA
===================================================== */

function refreshData(){

  ambilDataDonatur();

}


/* =====================================================
   JIKA UKURAN LAYAR BERUBAH
===================================================== */

let resizeTimer = null;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function(){

          if(donorData.length){

            tampilkanData(
              donorData
            );

          }

        },
        300
      );

  }
);


/* =====================================================
   START
===================================================== */

updateTanggal();

setInterval(
  updateTanggal,
  1000
);


/*
   Ambil data pertama kali
*/

tampilkanCache();

ambilDataDonatur();


/*
   Refresh data setiap 60 detik
*/

setInterval(
  ambilDataDonatur,
  60000
);

</script>


</body>

</html>
