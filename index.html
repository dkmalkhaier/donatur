<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Data Donatur DKM Al-Khaier</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {

  font-family: Arial, Helvetica, sans-serif;

  background: #f2f2f2;

  color: #222;

  overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

  width: 100%;

  background: #ffffff;

  padding: 12px 15px 10px;

  text-align: center;

  border-bottom: 1px solid #ddd;

  box-shadow: 0 2px 6px rgba(0,0,0,0.08);

  position: relative;

  z-index: 10;
}

.header h1 {

  margin: 0;

  font-size: 24px;

  font-weight: bold;
}

.header .subtitle {

  margin-top: 4px;

  font-size: 15px;

  color: #555;
}


/* =========================================================
   WAKTU
========================================================= */

#tanggal {

  margin-top: 6px;

  font-size: 14px;

  font-weight: bold;

  color: #333;
}


/* =========================================================
   TOTAL
========================================================= */

.info-container {

  width: 100%;

  display: flex;

  justify-content: center;

  gap: 15px;

  padding: 12px 15px;

  background: #fafafa;

  border-bottom: 1px solid #ddd;

  position: relative;

  z-index: 5;
}

.info-box {

  min-width: 210px;

  background: #ffffff;

  border-radius: 10px;

  padding: 10px 18px;

  text-align: center;

  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.info-title {

  font-size: 13px;

  color: #666;

  margin-bottom: 4px;
}

.info-value {

  font-size: 20px;

  font-weight: bold;
}

#totalDonasi {

  color: #087f23;
}

#jumlahDonatur {

  color: #333;
}


/* =========================================================
   AREA DONATUR
========================================================= */

.donor-area {

  position: relative;

  width: 100%;

  height: calc(100vh - 175px);

  overflow: hidden;

  background: #f2f2f2;
}


/* =========================================================
   SCROLL CONTAINER
========================================================= */

.donor-scroll {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: stretch;

  margin: 0;

  padding: 0;

  will-change: transform;

  transform: translate3d(0,0,0);
}


/* =========================================================
   LIST
========================================================= */

.donor-list {

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  flex-shrink: 0;

  margin: 0;

  padding: 0;
}


/* =========================================================
   CARD DONATUR
========================================================= */

.donor-card {

  width: min(900px, 94%);

  background: #ffffff;

  border-radius: 12px;

  margin: 7px 0;

  padding: 12px 16px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.10);

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;
}


/* KIRI */

.donor-left {

  flex: 1;

  min-width: 0;
}

.donor-name {

  font-size: 17px;

  font-weight: bold;

  color: #222;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.donor-info {

  margin-top: 4px;

  font-size: 13px;

  color: #777;
}


/* KANAN */

.donor-right {

  text-align: right;

  white-space: nowrap;
}

.donor-amount {

  font-size: 17px;

  font-weight: bold;

  color: #087f23;
}


/* =========================================================
   TOMBOL DETAIL
========================================================= */

.detail-button {

  position: fixed;

  right: 15px;

  bottom: 15px;

  z-index: 100;

  border: none;

  border-radius: 25px;

  background: #222;

  color: #fff;

  padding: 11px 18px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  box-shadow: 0 3px 10px rgba(0,0,0,0.25);
}

.detail-button:hover {

  background: #444;
}


/* =========================================================
   STATUS
========================================================= */

#statusData {

  position: fixed;

  left: 15px;

  bottom: 15px;

  z-index: 90;

  background: rgba(255,255,255,0.95);

  padding: 7px 12px;

  border-radius: 15px;

  font-size: 12px;

  color: #555;

  box-shadow: 0 2px 6px rgba(0,0,0,0.10);
}


/* =========================================================
   MODAL
========================================================= */

.modal {

  display: none;

  position: fixed;

  z-index: 1000;

  left: 0;

  top: 0;

  width: 100%;

  height: 100%;

  background: rgba(0,0,0,0.55);

  padding: 20px;
}

.modal-content {

  background: #fff;

  width: min(1000px, 100%);

  max-height: 90vh;

  margin: 30px auto;

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  flex-direction: column;

  box-shadow: 0 5px 25px rgba(0,0,0,0.30);
}

.modal-header {

  padding: 15px 18px;

  background: #222;

  color: #fff;

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.modal-header h2 {

  margin: 0;

  font-size: 18px;
}

.close {

  font-size: 28px;

  cursor: pointer;

  line-height: 1;
}

.modal-body {

  overflow: auto;

  padding: 10px 15px 20px;
}


/* =========================================================
   TABLE
========================================================= */

table {

  width: 100%;

  border-collapse: collapse;

  font-size: 14px;
}

th,
td {

  padding: 9px 8px;

  border-bottom: 1px solid #ddd;

  text-align: left;
}

th {

  background: #f0f0f0;

  position: sticky;

  top: 0;

  z-index: 2;
}

td.amount {

  text-align: right;

  white-space: nowrap;
}


/* =========================================================
   LOADING
========================================================= */

.loading {

  width: 100%;

  text-align: center;

  padding: 40px 20px;

  color: #777;

  font-size: 15px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

  .header h1 {

    font-size: 20px;
  }

  .header .subtitle {

    font-size: 13px;
  }

  .info-container {

    gap: 8px;

    padding: 8px;
  }

  .info-box {

    min-width: 0;

    flex: 1;

    padding: 8px 5px;
  }

  .info-title {

    font-size: 11px;
  }

  .info-value {

    font-size: 16px;
  }

  .donor-area {

    height: calc(100vh - 150px);
  }

  .donor-card {

    width: 94%;

    padding: 10px 12px;

    margin: 5px 0;
  }

  .donor-name {

    font-size: 15px;
  }

  .donor-info {

    font-size: 12px;
  }

  .donor-amount {

    font-size: 14px;
  }

  .detail-button {

    bottom: 12px;

    right: 12px;

    padding: 9px 14px;
  }

  #statusData {

    left: 10px;

    bottom: 12px;

    font-size: 10px;
  }
}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

  <h1>🕌 DKM Al-Khaier</h1>

  <div class="subtitle">
    Data Donatur Maulud Nabi (Rabiul Awal 1448 H)
  </div>

  <div id="tanggal">
    Memuat waktu...
  </div>

</div>


<!-- =======================================================
     INFORMASI
======================================================= -->

<div class="info-container">

  <div class="info-box">

    <div class="info-title">
      Total Donasi
    </div>

    <div
      class="info-value"
      id="totalDonasi">
      Rp 0
    </div>

  </div>


  <div class="info-box">

    <div class="info-title">
      Jumlah Donatur
    </div>

    <div
      class="info-value"
      id="jumlahDonatur">
      0
    </div>

  </div>

</div>


<!-- =======================================================
     AREA DONATUR
======================================================= -->

<div
  class="donor-area"
  id="donorArea">

  <div class="donor-scroll">

    <div
      class="donor-list"
      id="list1">
    </div>

    <div
      class="donor-list"
      id="list2">
    </div>

  </div>

</div>


<!-- =======================================================
     STATUS
======================================================= -->

<div id="statusData">
  Memuat data...
</div>


<!-- =======================================================
     BUTTON DETAIL
======================================================= -->

<button
  class="detail-button"
  onclick="bukaDetail()">

  Lihat Detail

</button>


<!-- =======================================================
     MODAL DETAIL
======================================================= -->

<div
  class="modal"
  id="modalDetail">

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        Detail Data Donatur
      </h2>

      <span
        class="close"
        onclick="tutupDetail()">
        &times;
      </span>

    </div>

    <div class="modal-body">

      <table>

        <thead>

          <tr>

            <th>No</th>

            <th>Tanggal</th>

            <th>Nama Donatur</th>

            <th>RT</th>

            <th>Jumlah</th>

          </tr>

        </thead>

        <tbody id="tabelDetail">

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>


/* =========================================================
   KONFIGURASI
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyAoAlwjZ19-LW9-Szi_tAn1dUg-KSZnUA2fDTcJvm3R6GidRffZbRh3BuNepbvGr_t/exec";


/*
   Kecepatan scroll.
   Semakin kecil = semakin lambat.
*/

const DONOR_SCROLL_SPEED = 32;


/* =========================================================
   VARIABLE
========================================================= */

let donorData = [];

let donorScrollAnimation = null;

let donorScrollPosition = 0;

let donorScrollLastTime = null;


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function formatRupiah(value) {

  let angka = Number(value) || 0;

  return "Rp " + angka.toLocaleString("id-ID");

}


/* =========================================================
   FORMAT TANGGAL
========================================================= */

function formatTanggalDisplay(value) {

  if (!value) {
    return "-";
  }

  return String(value);

}


/* =========================================================
   UPDATE WAKTU
========================================================= */

function updateTanggal() {

  const now = new Date();

  const bulan = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "Mei",
    "Jun",
    "Jul",
    "Agu",
    "Sep",
    "Okt",
    "Nov",
    "Des"
  ];

  const jam =
    String(now.getHours()).padStart(2, "0");

  const menit =
    String(now.getMinutes()).padStart(2, "0");

  const detik =
    String(now.getSeconds()).padStart(2, "0");

  const tanggal =
    String(now.getDate()).padStart(2, "0");

  const namaBulan =
    bulan[now.getMonth()];

  const tahun =
    now.getFullYear();

  document.getElementById("tanggal").textContent =
    jam + ":" +
    menit + ":" +
    detik + " " +
    tanggal + "/" +
    namaBulan + "/" +
    tahun;

}


/* Jalankan waktu */

updateTanggal();

setInterval(updateTanggal, 1000);


/* =========================================================
   STOP SCROLL
========================================================= */

function stopDonorScroll() {

  if (donorScrollAnimation !== null) {

    cancelAnimationFrame(
      donorScrollAnimation
    );

    donorScrollAnimation = null;

  }

}


/* =========================================================
   START SCROLL
========================================================= */

function startDonorScroll() {

  stopDonorScroll();

  const area =
    document.getElementById("donorArea");

  const scroll =
    document.querySelector(".donor-scroll");

  const lists =
    document.querySelectorAll(".donor-list");


  if (!area) return;

  if (!scroll) return;

  if (lists.length < 2) return;

  if (donorData.length === 0) return;


  const list1 = lists[0];

  const list2 = lists[1];


  /*
     Tunggu browser selesai menghitung
     tinggi semua kartu.
  */

  requestAnimationFrame(function() {

    requestAnimationFrame(function() {

      const listHeight =
        list1.offsetHeight;

      const areaHeight =
        area.clientHeight;


      console.log(
        "Tinggi list 1:",
        listHeight
      );

      console.log(
        "Tinggi area:",
        areaHeight
      );


      if (listHeight <= 0) {

        console.log(
          "List tidak memiliki tinggi."
        );

        return;

      }


      donorScrollPosition = 0;

      donorScrollLastTime = null;


      scroll.style.transform =
        "translate3d(0,0,0)";


      function animateScroll(timestamp) {


        if (!donorScrollLastTime) {

          donorScrollLastTime =
            timestamp;

        }


        let delta =
          (timestamp -
           donorScrollLastTime) / 1000;


        /*
           Mencegah loncatan besar apabila
           browser sempat berhenti.
        */

        if (delta > 0.05) {

          delta = 0.05;

        }


        donorScrollLastTime =
          timestamp;


        donorScrollPosition -=
          DONOR_SCROLL_SPEED * delta;


        /*
           Setelah list pertama selesai,
           kembali ke posisi awal list pertama.

           Karena list kedua adalah salinan
           yang sama persis, perpindahan
           terlihat terus menerus.
        */

        if (
          donorScrollPosition <=
          -listHeight
        ) {

          donorScrollPosition +=
            listHeight;

        }


        scroll.style.transform =
          "translate3d(0," +
          donorScrollPosition +
          "px,0)";


        donorScrollAnimation =
          requestAnimationFrame(
            animateScroll
          );

      }


      donorScrollAnimation =
        requestAnimationFrame(
          animateScroll
        );

    });

  });

}


/* =========================================================
   BUAT KARTU DONATUR
========================================================= */

function buatKartuDonatur(item) {

  const card =
    document.createElement("div");

  card.className =
    "donor-card";


  const left =
    document.createElement("div");

  left.className =
    "donor-left";


  const name =
    document.createElement("div");

  name.className =
    "donor-name";

  name.textContent =
    item.nama || "-";


  const info =
    document.createElement("div");

  info.className =
    "donor-info";


  const tanggal =
    formatTanggalDisplay(
      item.tanggal
    );


  const rt =
    item.rt !== undefined &&
    item.rt !== null &&
    String(item.rt).trim() !== ""
      ? "RT " + item.rt
      : "";


  info.textContent =
    tanggal +
    (rt ? " • " + rt : "");


  left.appendChild(name);

  left.appendChild(info);


  const right =
    document.createElement("div");

  right.className =
    "donor-right";


  const amount =
    document.createElement("div");

  amount.className =
    "donor-amount";

  amount.textContent =
    formatRupiah(item.jumlah);


  right.appendChild(amount);


  card.appendChild(left);

  card.appendChild(right);


  return card;

}


/* =========================================================
   TAMPILKAN DATA
========================================================= */

function tampilkanData(data) {


  /*
     Pastikan data berupa array.
  */

  const dataMasuk =
    Array.isArray(data)
      ? data
      : [];


  console.log(
    "Jumlah data diterima:",
    dataMasuk.length
  );


  /*
     Hanya buang baris yang tidak mempunyai
     nama donatur.

     TIDAK ADA batas 30,
     50,
     100,
     atau jumlah tertentu.
  */

  donorData =
    dataMasuk.filter(function(item) {

      return (
        item &&
        item.nama &&
        String(item.nama).trim() !== ""
      );

    });


  console.log(
    "Jumlah data ditampilkan:",
    donorData.length
  );


  /*
     Status di layar.
  */

  document.getElementById(
    "statusData"
  ).textContent =
    donorData.length +
    " data donatur";


  /*
     Jumlah donatur.
  */

  document.getElementById(
    "jumlahDonatur"
  ).textContent =
    donorData.length.toLocaleString("id-ID");


  /*
     Hitung total donasi.
  */

  let total = 0;


  donorData.forEach(function(item) {

    let jumlah =
      Number(item.jumlah) || 0;

    total += jumlah;

  });


  document.getElementById(
    "totalDonasi"
  ).textContent =
    formatRupiah(total);


  /*
     Ambil list.
  */

  const list1 =
    document.getElementById("list1");

  const list2 =
    document.getElementById("list2");


  list1.innerHTML = "";

  list2.innerHTML = "";


  stopDonorScroll();


  /*
     Jika tidak ada data.
  */

  if (donorData.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "loading";

    empty.textContent =
      "Belum ada data donatur.";

    list1.appendChild(empty);

    list2.appendChild(empty.cloneNode(true));

    return;

  }


  /*
     MASUKKAN SEMUA DATA KE LIST 1.
  */

  donorData.forEach(function(item) {

    list1.appendChild(
      buatKartuDonatur(item)
    );

  });


  /*
     MASUKKAN SEMUA DATA KE LIST 2.
  */

  donorData.forEach(function(item) {

    list2.appendChild(
      buatKartuDonatur(item)
    );

  });


  /*
     Mulai animasi setelah semua kartu
     benar-benar selesai dibuat.
  */

  startDonorScroll();

}


/* =========================================================
   AMBIL DATA DARI APPS SCRIPT
========================================================= */

async function ambilData() {

  try {


    document.getElementById(
      "statusData"
    ).textContent =
      "Mengambil data...";


    /*
       Tambahkan timestamp agar browser
       tidak menggunakan cache lama.
    */

    const url =
      API_URL +
      "?action=data&_=" +
      Date.now();


    console.log(
      "Memanggil API:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Data dari API:",
      data
    );


    /*
       Tampilkan data.
    */

    tampilkanData(data);


    /*
       Simpan cache.
    */

    try {

      localStorage.setItem(
        "donorData",
        JSON.stringify(data)
      );

      localStorage.setItem(
        "donorDataTime",
        Date.now().toString()
      );

    } catch (e) {

      console.log(
        "Cache tidak dapat disimpan:",
        e
      );

    }


  } catch (error) {


    console.error(
      "Gagal mengambil data:",
      error
    );


    document.getElementById(
      "statusData"
    ).textContent =
      "Gagal mengambil data";


  }

}


/* =========================================================
   TAMPILKAN CACHE
========================================================= */

function tampilkanCache() {

  try {


    const cache =
      localStorage.getItem(
        "donorData"
      );


    if (!cache) {

      return;

    }


    const waktu =
      Number(
        localStorage.getItem(
          "donorDataTime"
        )
      ) || 0;


    /*
       Cache hanya dipakai sebagai
       tampilan sementara.

       Setelah itu API tetap dipanggil
       untuk mendapatkan data terbaru.
    */

    const umur =
      Date.now() - waktu;


    if (
      umur >
      5 * 60 * 1000
    ) {

      return;

    }


    const data =
      JSON.parse(cache);


    if (
      Array.isArray(data)
    ) {

      tampilkanData(data);

    }


  } catch (error) {

    console.log(
      "Cache error:",
      error
    );

  }

}


/* =========================================================
   MODAL DETAIL
========================================================= */

function bukaDetail() {


  const tbody =
    document.getElementById(
      "tabelDetail"
    );


  tbody.innerHTML = "";


  /*
     Tampilkan SEMUA data.
  */

  donorData.forEach(
    function(item, index) {


      const tr =
        document.createElement("tr");


      const tdNo =
        document.createElement("td");

      tdNo.textContent =
        index + 1;


      const tdTanggal =
        document.createElement("td");

      tdTanggal.textContent =
        formatTanggalDisplay(
          item.tanggal
        );


      const tdNama =
        document.createElement("td");

      tdNama.textContent =
        item.nama || "-";


      const tdRT =
        document.createElement("td");

      tdRT.textContent =
        item.rt !== undefined &&
        item.rt !== null &&
        String(item.rt).trim() !== ""
          ? "RT " + item.rt
          : "-";


      const tdJumlah =
        document.createElement("td");

      tdJumlah.className =
        "amount";

      tdJumlah.textContent =
        formatRupiah(item.jumlah);


      tr.appendChild(tdNo);

      tr.appendChild(tdTanggal);

      tr.appendChild(tdNama);

      tr.appendChild(tdRT);

      tr.appendChild(tdJumlah);


      tbody.appendChild(tr);


    }
  );


  document.getElementById(
    "modalDetail"
  ).style.display =
    "block";

}


/* =========================================================
   TUTUP MODAL
========================================================= */

function tutupDetail() {

  document.getElementById(
    "modalDetail"
  ).style.display =
    "none";

}


/* =========================================================
   KLIK DI LUAR MODAL
========================================================= */

window.addEventListener(
  "click",
  function(event) {


    const modal =
      document.getElementById(
        "modalDetail"
      );


    if (
      event.target === modal
    ) {

      tutupDetail();

    }

  }
);


/* =========================================================
   REFRESH OTOMATIS
========================================================= */

/*
   Ambil data terbaru setiap 60 detik.
*/

setInterval(
  function() {

    ambilData();

  },
  60000
);


/* =========================================================
   MULAI
========================================================= */

tampilkanCache();

ambilData();


</script>

</body>

</html>
