<body>


<div class="container">


<!-- =====================================================

<!-- =====================================================

      class="marquee-text">

<!-- =====================================================

===================================================== -->

  </button>

     STATUS
===================================================== -->

  id="status"
  class="status">

  Memuat data...

</div>



<!-- =====================================================
     MODAL DETAIL DONATUR
===================================================== -->

<div
  id="detailDonaturModal"
  class="modal">


  <div class="modal-content">


    <div class="modal-header">

      <h2>
        📋 Detail Data Donatur
      </h2>

        class="close-btn"
        onclick="tutupDetailDonatur()">

        ×

      id="pengeluaranBody"

        Memuat data pengeluaran...
      </div>

    </div>

  </div>

<script>

/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwL6uA-jygTapluhwulphxrPKXNRvj8uCSGr0uq9SY6KFr3r9NClVQRhPeZIqijwFLL/exec";



/* =====================================================
   DATA GLOBAL
===================================================== */

let donorData = [];

let infoText =

  "🤲 Terima kasih kepada seluruh donatur DKM Al-Khaier. Semoga setiap kebaikan menjadi amal jariyah dan mendapatkan balasan terbaik dari Allah SWT. 🕌";



/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
  "dkm_al_khaier_donatur_cache_v3";

const INFO_CACHE_KEY =
  "dkm_al_khaier_info_cache_v2";

const CACHE_MAX_AGE =
  5 * 60 * 1000;



/* =====================================================
   FORMAT RUPIAH
===================================================== */

function formatRupiah(angka) {

  return (
    "Rp " +

    Number(
      angka || 0
    )
    .toLocaleString(
      "id-ID"
    )

  );
}



/* =====================================================
   JAM & TANGGAL
===================================================== */

function updateDateTime() {

  const now =
    new Date();


  const dd =
    String(
      now.getDate()
    )
    .padStart(
      2,
      "0"
    );


  const mm =
    String(
      now.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const yyyy =
    now.getFullYear();


  const hh =
    String(
      now.getHours()
    )
    .padStart(
      2,
      "0"
    );


  const min =
    String(
      now.getMinutes()
    )
    .padStart(
      2,
      "0"
    );


  const sec =
    String(
      now.getSeconds()
    )
    .padStart(
      2,
      "0"
    );


  document
    .getElementById(
      "datetime"
    )
    .textContent =

      dd +
      "/" +

      mm +
      "/" +

      yyyy +

      " : " +

      hh +
      ":" +

      min +
      ":" +

      sec;

}


setInterval(
  updateDateTime,
  1000
);

updateDateTime();



/* =====================================================
   JSONP REQUEST
===================================================== */

function apiRequest(
  action,
  callback
) {

  const callbackName =

    "callback_" +

    Date.now() +

    "_" +

    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement(
      "script"
    );


  let selesai =
    false;


  window[callbackName] =
    function(response) {

      if (selesai) {

        return;

      }


      selesai =
        true;


      try {

        callback(
          response
        );

      }

      catch (error) {

        console.error(
          error
        );

      }


      delete window[
        callbackName
      ];


      script.remove();

    };


  script.onerror =
    function() {

      if (selesai) {

        return;

      }


      selesai =
        true;


      callback({

        success: false,

        message:
          "Gagal terhubung ke Google Apps Script."

      });


      delete window[
        callbackName
      ];


      script.remove();

    };


  script.src =

    API_URL +

    "?action=" +

    encodeURIComponent(
      action
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  document.body.appendChild(
    script
  );

}



/* =====================================================
   AMBIL DATA DONATUR
===================================================== */

function ambilDataDonatur() {

  apiRequest(

    "data",

    function(response) {

      if (

        !response ||

        response.success !== true

      ) {

        updateStatus(
          "Tidak dapat mengambil data donatur."
        );

        return;

      }


      donorData =

        Array.isArray(
          response.data
        )

        ?

        response.data

        :

        [];


      try {

        localStorage.setItem(

          CACHE_KEY,

          JSON.stringify({

            time:
              Date.now(),

            data:
              donorData

          })

        );

      }

      catch (e) {}


      tampilkanDataDonatur();

    }

  );

}



/* =====================================================
   TAMPIL DATA DONATUR
===================================================== */

function tampilkanDataDonatur() {

  donorData =

    donorData.filter(

      function(item) {

        return (

          item &&

          item.nama &&

          String(
            item.nama
          )
          .trim() !== ""

        );

      }

    );


  document
    .getElementById(
      "jumlahDonatur"
    )
    .textContent =

      donorData.length;


  let total =
    0;


  donorData.forEach(

    function(item) {

      total +=

        Number(
          item.jumlah
        )

        ||

        0;

    }

  );


  document
    .getElementById(
      "totalDonasi"
    )
    .textContent =

      formatRupiah(
        total
      );


  updateMarquee();

  updateStatus(
    "Data diperbarui"
  );

}



/* =====================================================
   AMBIL INFO
===================================================== */

function ambilInfo() {

  apiRequest(

    "info",

    function(response) {

      if (

        response &&

        response.success === true &&

        response.text

      ) {

        infoText =
          response.text;


        try {

          localStorage.setItem(

            INFO_CACHE_KEY,

            JSON.stringify({

              time:
                Date.now(),

              text:
                infoText

            })

          );

        }

        catch (e) {}


        updateMarquee();

      }

    }

  );

}



/* =====================================================
   TEKS BERJALAN

   BERISI:

   1. INFO DARI SHEET INFO
   2. DATA DONATUR
===================================================== */

function updateMarquee() {

  const marquee =
    document.getElementById(
      "marqueeText"
    );


  let text =
    infoText;


  if (

    donorData.length > 0

  ) {

    text +=

      "  •  👥 DATA DONATUR:  ";


    donorData.forEach(

      function(item) {

        text +=

          "  •  " +

          String(
            item.nama || ""
          ) +

          " (RT " +

          String(
            item.rt || "-"
          ) +

          ") " +

          formatRupiah(
            item.jumlah
          );

      }

    );

  }


  marquee.textContent =
    text;

}



/* =====================================================
   CACHE DONATUR
===================================================== */

function tampilkanCacheDonatur() {

  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!raw) {

      return;

    }


    const cached =
      JSON.parse(
        raw
      );


    if (

      !cached ||

      !Array.isArray(
        cached.data
      )

    ) {

      return;

    }


    if (

      Date.now() -

      Number(
        cached.time || 0
      )

      >

      CACHE_MAX_AGE

    ) {

      return;

    }


    donorData =
      cached.data;


    tampilkanDataDonatur();

  }

  catch (e) {}

}



/* =====================================================
   CACHE INFO
===================================================== */

function tampilkanCacheInfo() {

  try {

    const raw =
      localStorage.getItem(
        INFO_CACHE_KEY
      );


    if (!raw) {

      return;

    }


    const cached =
      JSON.parse(
        raw
      );


    if (

      !cached ||

      !cached.text

    ) {

      return;

    }


    if (

      Date.now() -

      Number(
        cached.time || 0
      )

      >

      CACHE_MAX_AGE

    ) {

      return;

    }


    infoText =
      cached.text;


    updateMarquee();

  }

  catch (e) {}

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}



/* =====================================================
   BUKA DETAIL DONATUR
===================================================== */

function bukaDetailDonatur() {

  const tbody =
    document.getElementById(
      "detailTableBody"
    );


  tbody.innerHTML =
    "";


  if (

    !donorData ||

    donorData.length === 0

  ) {

    tbody.innerHTML =

      '<tr>' +

      '<td colspan="5" ' +

      'style="text-align:center;">' +

      'Belum ada data donatur.' +

      '</td>' +

      '</tr>';

  }

  else {

    donorData.forEach(

      function(item) {

        const tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML =

          '<td>' +

          escapeHTML(
            item.nomor
          ) +

          '</td>' +

          '<td>' +

          escapeHTML(
            item.tanggal
          ) +

          '</td>' +

          '<td>' +

          escapeHTML(
            item.nama
          ) +

          '</td>' +

          '<td>' +

          escapeHTML(
            item.rt
          ) +

          '</td>' +

          '<td class="amount-cell">' +

          formatRupiah(
            item.jumlah
          ) +

          '</td>';


        tbody.appendChild(
          tr
        );

      }

    );

  }


  document
    .getElementById(
      "detailDonaturModal"
    )
    .style.display =
      "block";

}



/* =====================================================
   TUTUP DETAIL DONATUR
===================================================== */

function tutupDetailDonatur() {

  document
    .getElementById(
      "detailDonaturModal"
    )
    .style.display =
      "none";

}



/* =====================================================
   BUKA DETAIL PENGELUARAN
===================================================== */

function bukaPengeluaran() {

  const body =
    document.getElementById(
      "pengeluaranBody"
    );


  body.innerHTML =

    '<div class="loading-detail">' +

    'Memuat data pengeluaran...' +

    '</div>';


  document
    .getElementById(
      "pengeluaranModal"
    )
    .style.display =
      "block";


  apiRequest(

    "pengeluaran",

    function(response) {

      tampilkanPengeluaran(
        response
      );

    }

  );

}



/* =====================================================
   TAMPIL DETAIL PENGELUARAN
===================================================== */

function tampilkanPengeluaran(response) {

  const body =
    document.getElementById(
      "pengeluaranBody"
    );


  if (

    !response ||

    response.success !== true

  ) {

    body.innerHTML =

      '<div class="empty-detail">' +

      escapeHTML(

        response && response.message

        ?

        response.message

        :

        "Gagal mengambil data pengeluaran."

      ) +

      '</div>';


    return;

  }


  const data =

    Array.isArray(
      response.data
    )

    ?

    response.data

    :

    [];


  let html =
    '<div class="pengeluaran-list">';


  if (
    data.length === 0
  ) {

    html +=

      '<div class="empty-detail">' +

      'Belum ada data pengeluaran.' +

      '</div>';

  }

  else {

    data.forEach(

      function(item) {

        html +=

          '<div class="pengeluaran-item">' +

          '<div class="pengeluaran-nama">' +

          escapeHTML(
            item.keterangan
          ) +

          '</div>' +

          '<div class="pengeluaran-jumlah">' +

          formatRupiah(
            item.jumlah
          ) +

          '</div>' +

          '</div>';

      }

    );

  }


  html +=
    '</div>';


  html +=

    '<div class="ringkasan-box">' +


    '<div class="ringkasan-row total-pengeluaran">' +

    '<div class="ringkasan-label">' +

    'Total Pengeluaran' +

    '</div>' +

    '<div class="ringkasan-value">' +

    formatRupiah(
      response.totalPengeluaran
    ) +

    '</div>' +

    '</div>' +


    '<div class="ringkasan-row sisa-uang">' +

    '<div class="ringkasan-label">' +

    'Sisa Uang' +

    '</div>' +

    '<div class="ringkasan-value">' +

    formatRupiah(
      response.sisaUang
    ) +

    '</div>' +

    '</div>' +


    '</div>';


  body.innerHTML =
    html;

}



/* =====================================================
   TUTUP PENGELUARAN
===================================================== */

function tutupPengeluaran() {

  document
    .getElementById(
      "pengeluaranModal"
    )
    .style.display =
      "none";

}



/* =====================================================
   KLIK DI LUAR MODAL
===================================================== */

window.onclick =
  function(event) {

    const donorModal =
      document.getElementById(
        "detailDonaturModal"
      );


    const pengeluaranModal =
      document.getElementById(
        "pengeluaranModal"
      );


    if (
      event.target === donorModal
    ) {

      tutupDetailDonatur();

    }


    if (
      event.target === pengeluaranModal
    ) {

      tutupPengeluaran();

    }

  };



/* =====================================================
   STATUS
===================================================== */

function updateStatus(message) {

  const status =
    document.getElementById(
      "status"
    );


  if (status) {

    status.textContent =
      message;

  }

}



/* =====================================================
   REFRESH DATA
===================================================== */

function refreshSemua() {

  ambilDataDonatur();

  ambilInfo();

}



/* =====================================================
   JALANKAN SAAT HALAMAN DIBUKA
===================================================== */

tampilkanCacheDonatur();

tampilkanCacheInfo();


ambilDataDonatur();

ambilInfo();



/* =====================================================
   REFRESH OTOMATIS
   SETIAP 60 DETIK
===================================================== */

setInterval(

  function() {

    ambilDataDonatur();

    ambilInfo();

  },

  60000

);

</script>
