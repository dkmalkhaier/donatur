
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<base target="_top">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Data Donatur DKM Al-Khaier</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  font-family: Arial, sans-serif;

  background: #eeeeee;
}


/* =========================================================
   CONTAINER UTAMA
========================================================= */

.container {

  width: 100%;
  height: 100vh;

  max-width: 1000px;

  margin: auto;

  display: flex;
  flex-direction: column;

  background: white;

  overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

  flex-shrink: 0;

  text-align: center;

  padding: 14px 10px 10px 10px;

  background: white;
}


.header h1 {

  margin: 0;

  font-size: 24px;

  font-weight: bold;

  color: #1d2a30;
}


.header h2 {

  margin: 5px 0 0 0;

  font-size: 16px;

  font-weight: normal;

  color: #555;
}


#tanggal {

  margin-top: 7px;

  font-size: 13px;

  color: #777;
}


/* =========================================================
   RINGKASAN
========================================================= */

.summary {

  flex-shrink: 0;

  display: flex;

  gap: 10px;

  padding: 8px 10px 10px 10px;
}


.summary-box {

  flex: 1;

  padding: 10px;

  border-radius: 10px;

  background: #f7f7f7;

  border: 1px solid #dddddd;

  text-align: center;
}


.summary-title {

  font-size: 13px;

  color: #666;

  margin-bottom: 4px;
}


.summary-value {

  font-size: 20px;

  font-weight: bold;

  color: #1d2a30;
}


.summary-small {

  font-size: 12px;

  color: #777;

  margin-top: 3px;
}


/* =========================================================
   TOMBOL DETAIL
========================================================= */

.detail-button {

  border: none;

  border-radius: 7px;

  padding: 7px 13px;

  margin-top: 6px;

  background: #1d2a30;

  color: white;

  cursor: pointer;

  font-size: 12px;
}


.detail-button:hover {

  opacity: 0.9;
}


/* =========================================================
   AREA DONATUR
========================================================= */

.donor-area {
  position: relative;

  height: 65vh;
  flex: 0 0 65vh;

  min-height: 250px;

  margin: 0 10px 10px 10px;

  border-radius: 10px;

  border: 1px solid #dddddd;

  background: linear-gradient(
    180deg,
    #f8f8f8,
    #eeeeee
  );

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}


/* =========================================================
   SCROLL BAR
========================================================= */

.donor-area::-webkit-scrollbar {

  width: 7px;
}


.donor-area::-webkit-scrollbar-track {

  background: #eeeeee;
}


.donor-area::-webkit-scrollbar-thumb {

  background: #aaaaaa;

  border-radius: 10px;
}


/* =========================================================
   DAFTAR DONATUR
========================================================= */

.donor-scroll {

  position: relative;

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  height: auto;

  padding: 5px 0 20px 0;

  /*
     Jangan menggunakan:
     position:absolute
     transform
     height:50%
  */

  transform: none !important;
}


/* =========================================================
   KARTU DONATUR
========================================================= */

.donor-card {

  width: calc(100% - 20px);

  flex-shrink: 0;

  margin: 5px 0;

  padding: 10px 12px;

  border-radius: 9px;

  background: white;

  border: 1px solid #dddddd;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.06);
}


.donor-name {

  font-size: 15px;

  font-weight: bold;

  color: #222;

  word-break: break-word;
}


.donor-meta {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  margin-top: 5px;

  font-size: 12px;

  color: #777;
}


.donor-amount {

  flex-shrink: 0;

  font-size: 13px;

  font-weight: bold;

  color: #1d2a30;

  text-align: right;
}


/* =========================================================
   LOADING
========================================================= */

#loading {

  flex-shrink: 0;

  text-align: center;

  padding: 5px;

  font-size: 12px;

  color: #777;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-message {

  padding: 30px;

  text-align: center;

  color: #777;

  font-size: 14px;
}


/* =========================================================
   STATUS
========================================================= */

#status {

  position: fixed;

  left: 50%;

  bottom: 8px;

  transform: translateX(-50%);

  z-index: 999;

  padding: 5px 10px;

  border-radius: 5px;

  background: rgba(0,0,0,0.7);

  color: white;

  font-size: 11px;

  pointer-events: none;
}


/* =========================================================
   MODAL
========================================================= */

.modal {

  display: none;

  position: fixed;

  z-index: 1000;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  background: rgba(0,0,0,0.55);

  padding: 20px;
}


.modal-content {

  width: 100%;

  max-width: 900px;

  max-height: 90vh;

  margin: auto;

  background: white;

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  flex-direction: column;
}


.modal-header {

  flex-shrink: 0;

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 12px 15px;

  background: #1d2a30;

  color: white;
}


.modal-header h3 {

  margin: 0;

  font-size: 17px;
}


.close {

  font-size: 25px;

  line-height: 20px;

  cursor: pointer;
}


.modal-body {

  overflow: auto;

  padding: 10px;
}


/* =========================================================
   TABEL DETAIL
========================================================= */

.detail-table {

  width: 100%;

  border-collapse: collapse;

  font-size: 13px;
}


.detail-table th {

  position: sticky;

  top: 0;

  z-index: 2;

  padding: 9px 7px;

  background: #1d2a30;

  color: white;

  text-align: center;
}


.detail-table td {

  padding: 8px 7px;

  border-bottom: 1px solid #dddddd;

  vertical-align: top;
}


.detail-table tbody tr:nth-child(even) {

  background: #f7f7f7;
}


.detail-table .rupiah {

  text-align: right;

  white-space: nowrap;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .donor-area {
    height: 58vh;
    flex: 0 0 58vh;

    min-height: 220px;

    margin-left: 7px;
    margin-right: 7px;
  }

}


</style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="header">

    <h1>
      🕌 DKM Al-Khaier
    </h1>

    <h2>
      Data Donatur Maulud Nabi (Rabiul Awal 1448 H)
    </h2>

    <div id="tanggal">
      Memuat waktu...
    </div>

  </div>


  <!-- =====================================================
       RINGKASAN
  ====================================================== -->

  <div class="summary">


    <div class="summary-box">

      <div class="summary-title">
        Total Donasi
      </div>

      <div
        id="totalDonasi"
        class="summary-value"
      >
        Rp 0
      </div>

    </div>


    <div class="summary-box">

      <div class="summary-title">
        Jumlah Donatur
      </div>

      <div
        id="jumlahDonatur"
        class="summary-value"
      >
        0
      </div>

      <button
        class="detail-button"
        onclick="bukaDetail()"
      >
        Lihat Detail
      </button>

    </div>


  </div>


  <!-- =====================================================
       LOADING
  ====================================================== -->

  <div id="loading">
    Menghubungkan ke data donatur...
  </div>


  <!-- =====================================================
       AREA SEMUA DONATUR
  ====================================================== -->

  <div
    id="donorArea"
    class="donor-area"
  ></div>


</div>


<!-- =========================================================
     STATUS
========================================================= -->

<div id="status"></div>


<!-- =========================================================
     MODAL DETAIL
========================================================= -->

<div
  id="detailModal"
  class="modal"
>


  <div class="modal-content">


    <div class="modal-header">

      <h3>
        Detail Data Donatur
      </h3>

      <span
        class="close"
        onclick="tutupDetail()"
      >
        &times;
      </span>

    </div>


    <div class="modal-body">

      <table class="detail-table">

        <thead>

          <tr>

            <th>No</th>

            <th>Tanggal</th>

            <th>Nama Donatur</th>

            <th>RT</th>

            <th>Jumlah</th>

          </tr>

        </thead>


        <tbody id="detailBody">

        </tbody>

      </table>

    </div>


  </div>

</div>


<script>

/* =========================================================
   KONFIGURASI API
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyAoAlwjZ19-LW9-Szi_tAn1dUg-KSZnUA2fDTcJvm3R6GidRffZbRh3BuNepbvGr_t/exec";


/* =========================================================
   VARIABEL GLOBAL
========================================================= */

let donorData = [];

const CACHE_KEY =
  "dkm_al_khaier_donatur_cache_v1";

const CACHE_MAX_AGE =
  5 * 60 * 1000;


/*
   Variabel ini tetap ada agar tidak mengganggu
   kode lain yang mungkin sudah menggunakannya.
*/

let donorScrollAnimation = null;


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function formatRupiah(angka) {

  const nilai =
    Number(angka) || 0;

  return "Rp " +
    nilai.toLocaleString("id-ID");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   TANGGAL DAN WAKTU REALTIME
========================================================= */

function updateTanggal() {

  const sekarang =
    new Date();


  const hari =
    String(sekarang.getDate())
      .padStart(2, "0");


  const bulan =
    String(sekarang.getMonth() + 1)
      .padStart(2, "0");


  const tahun =
    sekarang.getFullYear();


  const jam =
    String(sekarang.getHours())
      .padStart(2, "0");


  const menit =
    String(sekarang.getMinutes())
      .padStart(2, "0");


  const detik =
    String(sekarang.getSeconds())
      .padStart(2, "0");


  const tanggal =
    document.getElementById("tanggal");


  if (tanggal) {

    tanggal.textContent =
      hari + "/" +
      bulan + "/" +
      tahun +
      " : " +
      jam + ":" +
      menit + ":" +
      detik;

  }

}


updateTanggal();


setInterval(
  updateTanggal,
  1000
);


/* =========================================================
   HENTIKAN AUTO SCROLL
========================================================= */

function function stopDonorScroll() {

  if (donorScrollAnimation) {

    cancelAnimationFrame(
      donorScrollAnimation
    );

    clearTimeout(
      donorScrollAnimation
    );
  }

  donorScrollAnimation = null;
}

/* =========================================================
   AUTO SCROLL
========================================================= */

function startDonorScroll() {

  stopDonorScroll();

  const area = document.getElementById("donorArea");

  if (!area) return;

  setTimeout(function() {

    /*
     * Hitung tinggi sebenarnya setelah
     * semua kartu selesai dibuat browser.
     */
    const maxScroll =
      area.scrollHeight - area.clientHeight;


    /*
     * Kalau semua data sudah terlihat,
     * tidak perlu auto-scroll.
     */
    if (maxScroll <= 5) {
      return;
    }


    let lastTime = null;

    /*
     * Kecepatan scroll.
     * Semakin kecil semakin pelan.
     */
    const speed = 15;


    function animate(timestamp) {

      if (!lastTime) {
        lastTime = timestamp;
      }


      const delta =
        Math.min(
          0.05,
          (timestamp - lastTime) / 1000
        );


      lastTime = timestamp;


      /*
       * Scroll perlahan.
       */
      area.scrollTop += speed * delta;


      /*
       * Hitung posisi paling bawah
       * setiap frame karena tinggi konten
       * bisa berubah.
       */
      const posisiBawah =
        area.scrollHeight -
        area.clientHeight;


      /*
       * SUDAH SAMPAI BARIS TERAKHIR
       */
      if (
        area.scrollTop >=
        posisiBawah - 2
      ) {

        /*
         * Paksa benar-benar ke posisi paling bawah.
         * Ini penting agar baris terakhir
         * tidak tertinggal.
         */
        area.scrollTop = posisiBawah;


        /*
         * Berhenti di baris terakhir
         * selama 4 detik.
         */
        donorScrollAnimation =
          setTimeout(function() {

            /*
             * Kembali ke baris pertama.
             */
            area.scrollTop = 0;

            lastTime = null;


            /*
             * Mulai lagi dari atas.
             */
            donorScrollAnimation =
              requestAnimationFrame(
                animate
              );

          }, 4000);


        return;
      }


      donorScrollAnimation =
        requestAnimationFrame(
          animate
        );
    }


    /*
     * Mulai dari baris pertama.
     */
    area.scrollTop = 0;

    donorScrollAnimation =
      requestAnimationFrame(
        animate
      );


  }, 1000);
}


/* =========================================================
   CACHE
========================================================= */

function tampilkanCache() {

  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!raw) {
      return false;
    }


    const cached =
      JSON.parse(raw);


    if (
      !cached ||
      !Array.isArray(cached.data)
    ) {
      return false;
    }


    /*
       Cache hanya dipakai jika
       masih dalam waktu yang ditentukan.
    */

    if (
      Date.now() -
      Number(cached.time || 0)
      >
      CACHE_MAX_AGE
    ) {

      return false;
    }


    donorData =
      cached.data.slice();


    tampilkanData(
      donorData,
      true
    );


    return true;

  }

  catch (error) {

    return false;

  }

}


/* =========================================================
   AMBIL DATA DARI APPS SCRIPT
========================================================= */

function ambilData() {


  const loading =
    document.getElementById(
      "loading"
    );


  if (
    loading &&
    !donorData.length
  ) {

    loading.textContent =
      "Menghubungkan ke data donatur...";

  }


  /*
     JSONP callback unik.
  */

  const callbackName =
    "callback_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement(
      "script"
    );


  let selesai = false;


  /*
     CALLBACK
  */

  window[callbackName] =
    function(response) {


      if (selesai) {
        return;
      }


      selesai = true;


      try {


        /*
           Pastikan API berhasil.
        */

        if (
          !response ||
          response.success !== true
        ) {

          tampilkanError(
            "Data tidak dapat diambil."
          );

          return;
        }


        /*
           Ambil SEMUA data.
           
           Tidak ada:
           slice()
           limit
           pagination
           pembatas jumlah data
        */

        donorData =
          Array.isArray(response.data)
            ? response.data.slice()
            : [];


        /*
           Simpan cache.
        */

        try {

          localStorage.setItem(
            CACHE_KEY,

            JSON.stringify({
              time: Date.now(),
              data: donorData
            })
          );

        }

        catch (e) {}


        /*
           Tampilkan SEMUA data.
        */

        tampilkanData(
          donorData,
          false
        );

      }

      catch (error) {

        console.error(error);

        tampilkanError(
          "Terjadi kesalahan membaca data."
        );

      }

      finally {


        delete window[
          callbackName
        ];


        script.remove();

      }

    };


  /*
     ERROR SCRIPT
  */

  script.onerror =
    function() {


      if (selesai) {
        return;
      }


      selesai = true;


      if (!donorData.length) {

        tampilkanError(
          "Tidak dapat terhubung ke Google Apps Script."
        );

      }

      else {

        const status =
          document.getElementById(
            "status"
          );


        if (status) {

          status.textContent =
            "Data terakhir ditampilkan";

        }

      }


      delete window[
        callbackName
      ];


      script.remove();

    };


  /*
     URL REQUEST
  */

  script.src =
    API_URL +
    "?action=data" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* =========================================================
   TAMPILKAN DATA
========================================================= */

function tampilkanData(
  data,
  fromCache = false
) {


  /*
     ========================================================
     BAGIAN PALING PENTING
     ========================================================

     Ambil seluruh array.

     Tidak ada pembatas jumlah data.
  */

  donorData =
    Array.isArray(data)
      ? data.slice()
      : [];


  /*
     Hanya buang item yang benar-benar
     tidak mempunyai nama.

     Semua baris yang mempunyai nama
     akan ditampilkan, termasuk jumlah 0.
  */

  donorData =
    donorData.filter(function(item) {

      return (
        item &&
        String(
          item.nama || ""
        ).trim() !== ""
      );

    });


  /*
     JUMLAH DONATUR
  */

  const jumlahDonatur =
    document.getElementById(
      "jumlahDonatur"
    );


  if (jumlahDonatur) {

    jumlahDonatur.textContent =
      donorData.length;

  }


  /*
     TOTAL DONASI
  */

  let total = 0;


  donorData.forEach(
    function(item) {

      total +=
        Number(
          item.jumlah
        ) || 0;

    }
  );


  const totalDonasi =
    document.getElementById(
      "totalDonasi"
    );


  if (totalDonasi) {

    totalDonasi.textContent =
      formatRupiah(total);

  }


  /*
     AREA DONATUR
  */

  const area =
    document.getElementById(
      "donorArea"
    );


  if (!area) {
    return;
  }


  /*
     Hentikan animasi lama.
  */

  stopDonorScroll();


  /*
     DATA KOSONG
  */

  if (
    donorData.length === 0
  ) {


    area.innerHTML =
      '<div class="empty-message">' +
      'Belum ada data donatur.' +
      '</div>';


    const status =
      document.getElementById(
        "status"
      );


    if (status) {

      status.textContent =
        "Data kosong";

    }


    return;
  }


  /*
     ========================================================
     BUAT CONTAINER
     ========================================================
  */

  const scroll =
    document.createElement(
      "div"
    );


  scroll.className =
    "donor-scroll";


  /*
     ========================================================
     FUNGSI BUAT SATU KARTU
     ========================================================
  */

  function buatKartuDonatur(
    item
  ) {


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "donor-card";


    const nama =
      escapeHTML(
        item.nama || ""
      );


    const tanggal =
      escapeHTML(
        item.tanggal || ""
      );


    const rt =
      escapeHTML(
        item.rt ?? ""
      );


    const jumlah =
      formatRupiah(
        item.jumlah
      );


    card.innerHTML = `

      <div class="donor-name">
        ${nama}
      </div>

      <div class="donor-meta">

        <span>
          ${tanggal}
          &nbsp; • &nbsp;
          RT ${rt}
        </span>

        <span class="donor-amount">
          ${jumlah}
        </span>

      </div>

    `;


    return card;

  }


  /*
     ========================================================
     MASUKKAN SEMUA DATA KE DOM
     ========================================================
  */

  const fragment =
    document.createDocumentFragment();


  donorData.forEach(
    function(item) {

      /*
         SATU item = SATU kartu.
         
         Tidak digandakan.
      */

      fragment.appendChild(
        buatKartuDonatur(item)
      );

    }
  );


  /*
     ========================================================
     TAMPILKAN
     ========================================================
  */

  area.innerHTML = "";


  area.appendChild(
    scroll
  );


  scroll.appendChild(
    fragment
  );


  /*
     Mulai dari paling atas.
  */

  area.scrollTop = 0;


  /*
     Loading selesai.
  */

  const loading =
    document.getElementById(
      "loading"
    );


  if (loading) {

    loading.textContent =
      "";

  }


  /*
     Status.
  */

  const status =
    document.getElementById(
      "status"
    );


  if (status) {

    status.textContent =
      fromCache
        ? "Data tersimpan — memperbarui..."
        : "Data diperbarui";


    setTimeout(
      function() {

        const s =
          document.getElementById(
            "status"
          );


        if (s) {
          s.textContent = "";
        }

      },
      2500
    );

  }


  /*
     Mulai auto-scroll setelah
     browser selesai menghitung
     seluruh tinggi data.
  */

  setTimeout(
    function() {

      startDonorScroll();

    },
    600
  );

}


/* =========================================================
   ERROR
========================================================= */

function tampilkanError(
  pesan
) {


  const status =
    document.getElementById(
      "status"
    );


  if (status) {

    status.textContent =
      pesan;

  }


  const loading =
    document.getElementById(
      "loading"
    );


  if (loading) {

    loading.textContent =
      pesan;

  }

}


/* =========================================================
   BUKA DETAIL
========================================================= */

function bukaDetail() {


  const modal =
    document.getElementById(
      "detailModal"
    );


  const body =
    document.getElementById(
      "detailBody"
    );


  if (!modal || !body) {
    return;
  }


  /*
     Kosongkan tabel terlebih dahulu.
  */

  body.innerHTML = "";


  /*
     TAMPILKAN SEMUA DONATUR.
     
     Tidak ada batas jumlah.
  */

  donorData.forEach(
    function(item, index) {


      const tr =
        document.createElement(
          "tr"
        );


      const nomor =
        item.nomor ||
        (index + 1);


      tr.innerHTML = `

        <td style="text-align:center;">
          ${escapeHTML(nomor)}
        </td>

        <td>
          ${escapeHTML(
            item.tanggal || ""
          )}
        </td>

        <td>
          ${escapeHTML(
            item.nama || ""
          )}
        </td>

        <td style="text-align:center;">
          ${escapeHTML(
            item.rt ?? ""
          )}
        </td>

        <td class="rupiah">
          ${formatRupiah(
            item.jumlah
          )}
        </td>

      `;


      body.appendChild(
        tr
      );

    }
  );


  modal.style.display =
    "flex";

}


/* =========================================================
   TUTUP DETAIL
========================================================= */

function tutupDetail() {


  const modal =
    document.getElementById(
      "detailModal"
    );


  if (modal) {

    modal.style.display =
      "none";

  }

}


/* =========================================================
   KLIK DI LUAR MODAL
========================================================= */

window.addEventListener(
  "click",
  function(event) {


    const modal =
      document.getElementById(
        "detailModal"
      );


    if (
      modal &&
      event.target === modal
    ) {

      tutupDetail();

    }

  }
);


/* =========================================================
   REFRESH DATA SETIAP 60 DETIK
========================================================= */

setInterval(
  function() {

    ambilData();

  },
  60000
);


/* =========================================================
   JIKA UKURAN LAYAR BERUBAH
========================================================= */

let resizeTimer = null;


window.addEventListener(
  "resize",
  function() {


    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {


          if (
            donorData &&
            donorData.length
          ) {

            tampilkanData(
              donorData,
              true
            );

          }


        },
        300
      );

  }
);


/* =========================================================
   MULAI
========================================================= */


/*
   Tampilkan cache jika ada,
   kemudian tetap ambil data terbaru.
*/

tampilkanCache();

ambilData();


</script>


</body>

</html>
