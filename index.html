
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Data Donatur DKM Al-Khaier</title>


<style>

/* =====================================================
   DASAR
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f5f7fa,
      #e8eef3
    );

  color: #222;

  overflow: hidden;
}


/* =====================================================
   CONTAINER UTAMA
===================================================== */

.container {

  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;

  max-width: 1000px;

  margin: auto;

  background: #ffffff;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  padding:
    15px
    10px
    10px;

  border-bottom:
    1px solid #ddd;

  flex-shrink: 0;
}

.header h1 {

  margin: 0;

  font-size: 25px;

  font-weight: 700;

  letter-spacing: .5px;
}

.header .subtitle {

  margin-top: 5px;

  font-size: 13px;

  color: #666;
}


/* =====================================================
   JAM
===================================================== */

.datetime {

  text-align: center;

  font-size: 14px;

  font-weight: 600;

  margin-top: 4px;

  color: #444;
}


/* =====================================================
   TOTAL DONASI
===================================================== */

.total-box {

  margin:
    12px
    15px
    8px;

  padding:
    15px
    10px;

  text-align: center;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #e8f5e9,
      #f5fff6
    );

  border:
    1px solid #c8e6c9;

  flex-shrink: 0;
}

.total-label {

  font-size: 14px;

  color: #555;

  margin-bottom: 5px;
}

.total-value {

  font-size: 30px;

  font-weight: 800;

  color: #1b5e20;

  line-height: 1.2;

  word-break: break-word;
}


/* =====================================================
   BARIS JUMLAH DONATUR + TOMBOL
===================================================== */

.donor-info-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin:
    4px
    15px
    10px;

  padding:
    10px
    12px;

  border-radius: 10px;

  background: #f7f7f7;

  border:
    1px solid #e0e0e0;

  flex-shrink: 0;
}


/* =====================================================
   JUMLAH DONATUR
===================================================== */

.donor-count {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  flex: 1;

  min-width: 0;
}

.donor-count-label {

  font-size: 14px;

  color: #555;

  white-space: nowrap;
}

.donor-count-value {

  font-size: 20px;

  font-weight: 700;

  color: #222;
}


/* =====================================================
   TOMBOL DETAIL
===================================================== */

.detail-btn {

  flex-shrink: 0;

  border: none;

  background: #2e7d32;

  color: white;

  padding:
    8px
    12px;

  border-radius: 7px;

  font-size: 12px;

  font-weight: 600;

  cursor: pointer;

  white-space: nowrap;

  transition: .2s;
}

.detail-btn:hover {

  background: #1b5e20;
}

.detail-btn:active {

  transform: scale(.96);
}


/* =====================================================
   AREA DONATUR
===================================================== */

.donor-area {

  position: relative;

  flex: 1;

  overflow: hidden;

  margin:
    0
    10px;

  border-radius: 10px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.95),
      rgba(248,248,248,.95)
    );

  border:
    1px solid #eee;
}


/* =====================================================
   BAYANGAN ATAS
===================================================== */

.donor-area::before {

  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 40px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,1),
      rgba(255,255,255,0)
    );

  z-index: 5;

  pointer-events: none;
}


/* =====================================================
   BAYANGAN BAWAH
===================================================== */

.donor-area::after {

  content: "";

  position: absolute;

  bottom: 0;
  left: 0;
  right: 0;

  height: 40px;

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,1),
      rgba(255,255,255,0)
    );

  z-index: 5;

  pointer-events: none;
}


/* =====================================================
   TRACK ANIMASI
===================================================== */

.donor-scroll {

  position: absolute;

  width: 100%;

  left: 0;
  top: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  will-change: transform;

  transform:
    translate3d(
      0,
      0,
      0
    );

  height: auto;

  margin: 0;
  padding: 0;
}


/* =====================================================
   SATU PUTARAN DATA
===================================================== */

.donor-list {

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  flex-shrink: 0;

  margin: 0;
  padding: 0 0 55px 0;
}


/* =====================================================
   KARTU DONATUR
===================================================== */

.donor-card {

  width:
    calc(100% - 20px);

  margin:
    5px 0;

  padding:
    10px
    12px;

  border-radius: 9px;

  background: #ffffff;

  border:
    1px solid #e5e5e5;

  box-shadow:
    0
    2px
    5px
    rgba(0,0,0,.05);

  flex-shrink: 0;
}

.donor-name {

  font-size: 15px;

  font-weight: 700;

  margin-bottom: 4px;

  color: #222;
}

.donor-meta {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  font-size: 12px;

  color: #777;
}

.donor-amount {

  font-size: 14px;

  font-weight: 700;

  color: #2e7d32;

  white-space: nowrap;
}


/* =====================================================
   PESAN KOSONG
===================================================== */

.empty-message {

  text-align: center;

  padding:
    30px
    15px;

  color: #888;

  font-size: 14px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  text-align: center;

  padding:
    30px
    10px;

  color: #777;

  font-size: 14px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

  display: none;

  position: fixed;

  z-index: 100;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  background:
    rgba(0,0,0,.55);

  padding: 20px;
}

.modal-content {

  position: relative;

  width: 100%;

  max-width: 900px;

  height: 90vh;

  margin: auto;

  background: white;

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  flex-direction: column;
}

.modal-header {

  padding:
    14px
    16px;

  border-bottom:
    1px solid #ddd;

  display: flex;

  align-items: center;

  justify-content: space-between;

  flex-shrink: 0;
}

.modal-header h2 {

  margin: 0;

  font-size: 18px;
}

.close-btn {

  border: none;

  background: transparent;

  font-size: 25px;

  cursor: pointer;

  color: #555;

  line-height: 1;
}

.modal-body {

  overflow: auto;

  padding: 10px;
}


/* =====================================================
   TABEL
===================================================== */

table {

  width: 100%;

  border-collapse: collapse;

  font-size: 13px;
}

th {

  background: #2e7d32;

  color: white;

  padding:
    9px
    7px;

  text-align: left;

  position: sticky;

  top: 0;

  z-index: 2;
}

td {

  padding:
    8px
    7px;

  border-bottom:
    1px solid #ddd;
}

tr:nth-child(even) {

  background: #f8f8f8;
}

.amount-cell {

  text-align: right;

  white-space: nowrap;
}


/* =====================================================
   STATUS
===================================================== */

.status {

  position: fixed;

  bottom: 8px;

  left: 50%;

  transform:
    translateX(-50%);

  padding:
    5px
    10px;

  font-size: 10px;

  color: #777;

  background:
    rgba(255,255,255,.8);

  border-radius: 5px;

  z-index: 20;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  body {

    background: #ffffff;
  }

  .container {

    max-width: none;

    width: 100%;
  }

  .header {

    padding:
      12px
      8px
      8px;
  }

  .header h1 {

    font-size: 21px;
  }

  .header .subtitle {

    font-size: 11px;
  }

  .datetime {

    font-size: 12px;
  }

  .total-box {

    margin:
      9px
      10px
      6px;

    padding:
      12px
      8px;
  }

  .total-label {

    font-size: 12px;
  }

  .total-value {

    font-size: 25px;
  }

  .donor-info-row {

    margin:
      3px
      10px
      7px;

    padding:
      8px
      9px;
  }

  .donor-count {

    gap: 6px;
  }

  .donor-count-label {

    font-size: 12px;
  }

  .donor-count-value {

    font-size: 18px;
  }

  .detail-btn {

    padding:
      7px
      10px;

    font-size: 11px;
  }

  .donor-area {

    margin:
      0
      7px;
  }

  .donor-card {

    width:
      calc(100% - 14px);

    padding:
      9px
      10px;
  }

  .donor-name {

    font-size: 14px;
  }

  .donor-meta {

    font-size: 11px;
  }

  .donor-amount {

    font-size: 13px;
  }

  .modal {

    padding: 8px;
  }

  .modal-content {

    height: 94vh;

    border-radius: 9px;
  }

  .modal-header {

    padding:
      11px
      12px;
  }

  .modal-header h2 {

    font-size: 16px;
  }

  table {

    font-size: 11px;
  }

  th,
  td {

    padding:
      7px
      5px;
  }

}


/* =====================================================
   HP SANGAT KECIL
===================================================== */

@media (max-width: 380px) {

  .donor-count-label {

    font-size: 11px;
  }

  .donor-count-value {

    font-size: 16px;
  }

  .detail-btn {

    padding:
      6px
      8px;

    font-size: 10px;
  }

  .total-value {

    font-size: 22px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================= -->

  <div class="header">

    <h1>
      🕌 DKM Al-Khaier
    </h1>

    <div class="subtitle">
      Data Donatur Maulud Nabi (Rabiul Awal 1448 H)
    </div>

    <div
      id="datetime"
      class="datetime">

      Memuat waktu...

    </div>

  </div>


  <!-- =================================================
       TOTAL DONASI
  ================================================= -->

  <div class="total-box">

    <div class="total-label">
      💰 Total Donasi Terkumpul
    </div>

    <div
      id="totalDonasi"
      class="total-value">

      Rp 0

    </div>

  </div>


  <!-- =================================================
       JUMLAH DONATUR
  ================================================= -->

  <div class="donor-info-row">

    <div class="donor-count">

      <span class="donor-count-label">
        👥 Jumlah Donatur
      </span>

      <strong
        id="jumlahDonatur"
        class="donor-count-value">

        0

      </strong>

    </div>


    <button
      class="detail-btn"
      onclick="bukaDetail()">

      Lihat Detail

    </button>

  </div>


  <!-- =================================================
       AREA DONATUR
  ================================================= -->

  <div
    id="donorArea"
    class="donor-area">

    <div
      id="loading"
      class="loading">

      Memuat data donatur...

    </div>

  </div>


</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
  id="status"
  class="status">

  Memuat data...

</div>


<!-- =====================================================
     MODAL DETAIL
===================================================== -->

<div
  id="detailModal"
  class="modal">

  <div class="modal-content">


    <div class="modal-header">

      <h2>
        📋 Detail Data Donatur
      </h2>

      <button
        class="close-btn"
        onclick="tutupDetail()">

        ×

      </button>

    </div>


    <div class="modal-body">

      <table>

        <thead>

          <tr>

            <th>No</th>

            <th>Tanggal</th>

            <th>Nama Donatur</th>

            <th>RT</th>

            <th>Jumlah</th>

          </tr>

        </thead>

        <tbody
          id="detailTableBody">

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>


/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwrnx3Pr9zyEv9ZfUi6e2QuhafgG7L_SkQuvRuOW576Q3yvjXKDht0HvXnSPngHiXaq/exec";


/* =====================================================
   DATA GLOBAL
===================================================== */

let donorData = [];


/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
  "dkm_al_khaier_donatur_cache_v1";

const CACHE_MAX_AGE =
  5 * 60 * 1000;


/* =====================================================
   KECEPATAN ANIMASI
===================================================== */

const DONOR_SCROLL_SPEED = 32;


/* =====================================================
   VARIABEL ANIMASI
===================================================== */

let donorScrollAnimation = null;

let donorScrollPosition = 0;

let donorScrollLastTime = null;


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function formatRupiah(angka) {

  return "Rp " +
    Number(angka || 0)
      .toLocaleString("id-ID");

}


/* =====================================================
   JAM & TANGGAL
===================================================== */

function updateDateTime() {

  const now =
    new Date();


  const dd =
    String(
      now.getDate()
    ).padStart(2, "0");


  const mm =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const yyyy =
    now.getFullYear();


  const hh =
    String(
      now.getHours()
    ).padStart(2, "0");


  const min =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  const sec =
    String(
      now.getSeconds()
    ).padStart(2, "0");


  document.getElementById(
    "datetime"
  ).textContent =

    dd +
    "/" +
    mm +
    "/" +
    yyyy +
    " : " +
    hh +
    ":" +
    min +
    ":" +
    sec;

}


setInterval(
  updateDateTime,
  1000
);

updateDateTime();


/* =====================================================
   AMBIL DATA JSONP
===================================================== */

function ambilData() {

  const loading =
    document.getElementById(
      "loading"
    );


  if (
    loading &&
    !donorData.length
  ) {

    loading.textContent =
      "Menghubungkan ke data donatur...";

  }


  const callbackName =
    "callback_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement(
      "script"
    );


  let selesai = false;


  window[callbackName] =
    function(response) {

      if (selesai) {

        return;
      }


      selesai = true;


      try {

        if (
          !response ||
          response.success !== true
        ) {

          tampilkanError(
            "Data tidak dapat diambil."
          );

          return;
        }


        donorData =
          Array.isArray(
            response.data
          )
          ? response.data
          : [];


        try {

          localStorage.setItem(

            CACHE_KEY,

            JSON.stringify({

              time:
                Date.now(),

              data:
                donorData

            })

          );

        } catch (e) {}


        tampilkanData(
          donorData
        );


      } catch (error) {

        tampilkanError(
          "Terjadi kesalahan membaca data."
        );


      } finally {

        delete window[
          callbackName
        ];

        script.remove();

      }

    };


  script.onerror =
    function() {

      if (selesai) {

        return;
      }


      selesai = true;


      if (
        !donorData.length
      ) {

        tampilkanError(
          "Tidak dapat terhubung ke Google Apps Script."
        );

      } else {

        document.getElementById(
          "status"
        ).textContent =
          "Data terakhir ditampilkan";

      }


      delete window[
        callbackName
      ];

      script.remove();

    };


  script.src =
    API_URL +
    "?action=data" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* =====================================================
   CACHE
===================================================== */

function tampilkanCache() {

  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!raw) {

      return false;
    }


    const cached =
      JSON.parse(
        raw
      );


    if (
      !cached ||
      !Array.isArray(
        cached.data
      )
    ) {

      return false;
    }


    if (
      Date.now() -
      Number(
        cached.time || 0
      ) >
      CACHE_MAX_AGE
    ) {

      return false;
    }


    donorData =
      cached.data;


    tampilkanData(
      donorData,
      true
    );


    return true;


  } catch (e) {

    return false;

  }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(
  data,
  fromCache = false
) {


  /* ===================================================
     FILTER DATA KOSONG
  =================================================== */

  donorData =

    (
      Array.isArray(data)
        ? data
        : []
    )
    .filter(
      function(item) {

        return (
          item &&
          item.nama &&
          String(
            item.nama
          ).trim() !== ""
        );

      }
    );


  /* ===================================================
     JUMLAH DONATUR
  =================================================== */

  document.getElementById(
    "jumlahDonatur"
  ).textContent =
    donorData.length;


  /* ===================================================
     TOTAL DONASI
  =================================================== */

  let total = 0;


  donorData.forEach(
    function(item) {

      total +=
        Number(
          item.jumlah
        ) || 0;

    }
  );


  document.getElementById(
    "totalDonasi"
  ).textContent =
    formatRupiah(
      total
    );


  /* ===================================================
     AREA DONATUR
  =================================================== */

  const area =
    document.getElementById(
      "donorArea"
    );


  stopDonorScroll();


  /* ===================================================
     JIKA DATA KOSONG
  =================================================== */

  if (
    donorData.length === 0
  ) {

    area.innerHTML =
      '<div class="empty-message">' +
      'Belum ada data donatur.' +
      '</div>';


    document.getElementById(
      "status"
    ).textContent =
      "Data kosong";


    return;
  }


  /* ===================================================
     TRACK UTAMA
  =================================================== */

  const scroll =
    document.createElement(
      "div"
    );

  scroll.className =
    "donor-scroll";


  /* ===================================================
     LIST PERTAMA
  =================================================== */

  const list1 =
    document.createElement(
      "div"
    );

  list1.className =
    "donor-list";


  /* ===================================================
     LIST KEDUA
  =================================================== */

  const list2 =
    document.createElement(
      "div"
    );

  list2.className =
    "donor-list";


  /* ===================================================
     BUAT KARTU DONATUR
  =================================================== */

  function buatKartuDonatur(
    item
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "donor-card";


    card.innerHTML = `

      <div class="donor-name">
        ${escapeHTML(item.nama)}
      </div>

      <div class="donor-meta">

        <span>

          ${escapeHTML(
            item.tanggal || ""
          )}

          &nbsp; • &nbsp;

          RT

          ${escapeHTML(
            item.rt || ""
          )}

        </span>


        <span
          class="donor-amount">

          ${formatRupiah(
            item.jumlah
          )}

        </span>

      </div>

    `;


    return card;

  }


  /* ===================================================
     MASUKKAN SEMUA DATA KE LIST 1
  =================================================== */

  donorData.forEach(
    function(item) {

      list1.appendChild(
        buatKartuDonatur(
          item
        )
      );

    }
  );


  /* ===================================================
     MASUKKAN SEMUA DATA KE LIST 2
  =================================================== */

  donorData.forEach(
    function(item) {

      list2.appendChild(
        buatKartuDonatur(
          item
        )
      );

    }
  );


  /* ===================================================
     SUSUN TRACK
  =================================================== */

  scroll.appendChild(
    list1
  );

  scroll.appendChild(
    list2
  );


  area.innerHTML = "";


  area.appendChild(
    scroll
  );


  /* ===================================================
     MULAI SETELAH LAYOUT SIAP
  =================================================== */

  requestAnimationFrame(
    function() {

      startDonorScroll();

    }
  );


  /* ===================================================
     STATUS
  =================================================== */

  document.getElementById(
    "status"
  ).textContent =

    fromCache
      ? "Data tersimpan — memperbarui..."
      : "Data diperbarui";


  setTimeout(
    function() {

      const status =
        document.getElementById(
          "status"
        );


      if (status) {

        status.textContent = "";

      }

    },
    2500
  );

}


/* =====================================================
   STOP ANIMASI
===================================================== */

function stopDonorScroll() {

  if (
    donorScrollAnimation
  ) {

    cancelAnimationFrame(
      donorScrollAnimation
    );

  }


  donorScrollAnimation =
    null;


  donorScrollLastTime =
    null;

}


/* =====================================================
   MULAI ANIMASI DONATUR
===================================================== */

function startDonorScroll() {

  stopDonorScroll();

  const area =
    document.getElementById("donorArea");

  const scroll =
    document.querySelector(".donor-scroll");

  const list1 =
    document.querySelector(".donor-list");

  if (
    !area ||
    !scroll ||
    !list1 ||
    !donorData.length
  ) {
    return;
  }

  /*
     Tunggu browser selesai menghitung tinggi
     seluruh kartu donatur.
  */
  requestAnimationFrame(function () {

    const listHeight =
      list1.getBoundingClientRect().height;

    if (listHeight <= 0) {
      return;
    }

    donorScrollPosition = 0;
    donorScrollLastTime = null;

    scroll.style.transform =
      "translate3d(0,0,0)";

    function animateScroll(timestamp) {

      if (!donorScrollLastTime) {
        donorScrollLastTime = timestamp;
      }

      const delta =
        Math.min(
          0.05,
          (timestamp - donorScrollLastTime) / 1000
        );

      donorScrollLastTime = timestamp;

      donorScrollPosition -=
        DONOR_SCROLL_SPEED * delta;

      /*
         Reset hanya setelah SELURUH LIST 1,
         termasuk donatur terakhir, selesai dilewati.
      */
      if (donorScrollPosition <= -listHeight) {
        donorScrollPosition = 0;
      }

      scroll.style.transform =
        "translate3d(0," +
        donorScrollPosition +
        "px,0)";

      donorScrollAnimation =
        requestAnimationFrame(animateScroll);
    }

    donorScrollAnimation =
      requestAnimationFrame(animateScroll);

  });
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   BUKA DETAIL
===================================================== */

function bukaDetail() {

  const tbody =
    document.getElementById(
      "detailTableBody"
    );


  tbody.innerHTML = "";


  if (
    !donorData ||
    donorData.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="text-align:center;">

          Belum ada data donatur.

        </td>

      </tr>

    `;

  }

  else {

    donorData.forEach(
      function(item) {

        const tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML = `

          <td>
            ${escapeHTML(
              item.nomor
            )}
          </td>

          <td>
            ${escapeHTML(
              item.tanggal
            )}
          </td>

          <td>
            ${escapeHTML(
              item.nama
            )}
          </td>

          <td>
            ${escapeHTML(
              item.rt
            )}
          </td>

          <td
            class="amount-cell">

            ${formatRupiah(
              item.jumlah
            )}

          </td>

        `;


        tbody.appendChild(
          tr
        );

      }
    );

  }


  document.getElementById(
    "detailModal"
  ).style.display =
    "block";

}


/* =====================================================
   TUTUP DETAIL
===================================================== */

function tutupDetail() {

  document.getElementById(
    "detailModal"
  ).style.display =
    "none";

}


/* =====================================================
   KLIK LUAR MODAL
===================================================== */

window.onclick =
  function(event) {

    const modal =
      document.getElementById(
        "detailModal"
      );


    if (
      event.target === modal
    ) {

      tutupDetail();

    }

  };


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  message
) {

  document.getElementById(
    "status"
  ).textContent =
    message;


  const loading =
    document.getElementById(
      "loading"
    );


  if (loading) {

    loading.remove();

  }

}


/* =====================================================
   JALANKAN CACHE
===================================================== */

tampilkanCache();


/* =====================================================
   AMBIL DATA TERBARU
===================================================== */

ambilData();


/* =====================================================
   RESPONSIVE
===================================================== */

let resizeTimer =
  null;


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          if (
            donorData.length
          ) {

            tampilkanData(
              donorData,
              true
            );

          }

        },
        250
      );

  }
);


/* =====================================================
   REFRESH OTOMATIS
   60 DETIK
===================================================== */

setInterval(
  function() {

    ambilData();

  },
  60000
);


</script>
