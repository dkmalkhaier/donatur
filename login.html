<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Login Donatur</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="page-container">

    <div class="card login-card">

        <div class="big-icon">
            🔐
        </div>

        <h1>FORM DONATUR</h1>

        <p>
            Masukkan password petugas
        </p>

        <input
            type="password"
            id="password"
            class="input"
            placeholder="Password"
            autocomplete="off">

        <button
            class="primary-btn"
            id="btnMasuk"
            onclick="login()">

            MASUK

        </button>

        <button
            class="back-btn"
            onclick="location.href='index.html'">

            ← Kembali

        </button>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>


<script>

/* =========================================
   URL GOOGLE APPS SCRIPT
   GANTI DENGAN URL WEB APP ANDA
========================================= */

const API_URL =
    "GANTI_DENGAN_URL_APPS_SCRIPT_ANDA";


/* =========================================
   LOGIN
========================================= */

function login() {

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("btnMasuk");


    if (!password) {

        message.textContent =
            "Password belum diisi.";

        return;

    }


    message.textContent =
        "Memeriksa password...";

    button.disabled = true;


    const callbackName =
        "loginCallback_" +
        Date.now();


    window[callbackName] =
        function(result) {

            button.disabled = false;


            if (result.success) {

                message.textContent =
                    "Login berhasil. Membuka form...";


                sessionStorage.setItem(
                    "donatur_token",
                    result.token
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "form.html";

                    },
                    500
                );


            } else {

                message.textContent =
                    result.message;

                document.getElementById(
                    "password"
                ).value = "";

            }


            delete window[callbackName];

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=login" +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {

            button.disabled = false;

            message.textContent =
                "Tidak dapat terhubung ke Google Apps Script.";

            delete window[callbackName];

        };


    document.body.appendChild(script);

}

</script>

</body>
</html>
