<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Login Donatur</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="page-container">

    <div class="card login-card">

        <div class="big-icon">
            🔐
        </div>

        <h1>FORM DONATUR</h1>

        <p>
            Masukkan password petugas
        </p>

        <input
            type="password"
            id="password"
            class="input"
            placeholder="Password"
            autocomplete="off">

        <button
            class="primary-btn"
            id="btnMasuk"
            onclick="login()">

            MASUK

        </button>

        <button
            class="back-btn"
            onclick="location.href='index.html'">

            ← Kembali

        </button>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>


<script>

/******************************************************
 * URL GOOGLE APPS SCRIPT
 ******************************************************/

const API_URL =
    "https://script.google.com/macros/s/AKfycbz6gAWFQH_X123EbWQfC8Nwr73i753b3kM14UROZUa9_Y3zeBWR73Hqa5HFSzbiQA/exec";


/******************************************************
 * LOGIN
 ******************************************************/

function login() {

    const password =
        document.getElementById(
            "password"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    const button =
        document.getElementById(
            "btnMasuk"
        );


    if (!password) {

        message.textContent =
            "Password belum diisi.";

        return;

    }


    message.textContent =
        "Memeriksa password...";


    button.disabled = true;


    const callbackName =
        "loginCallback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );


    window[callbackName] =
        function(result) {

            button.disabled = false;


            if (result.success) {

                sessionStorage.setItem(
                    "donatur_token",
                    result.token
                );


                message.textContent =
                    "Login berhasil.";


                setTimeout(
                    function() {

                        window.location.href =
                            "form.html";

                    },
                    300
                );


            } else {

                message.textContent =
                    result.message ||
                    "Login gagal.";


                document.getElementById(
                    "password"
                ).value = "";

            }


            delete window[callbackName];

            const oldScript =
                document.getElementById(
                    callbackName
                );

            if (oldScript) {
                oldScript.remove();
            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.id =
        callbackName;


    script.src =
        API_URL +
        "?action=login" +
        "&password=" +
        encodeURIComponent(
            password
        ) +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {

            button.disabled = false;


            message.textContent =
                "Tidak dapat terhubung ke Google Apps Script.";


            delete window[callbackName];

            script.remove();

        };


    document.body.appendChild(
        script
    );

}


/******************************************************
 * ENTER UNTUK LOGIN
 ******************************************************/

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );

</script>

</body>
</html>
